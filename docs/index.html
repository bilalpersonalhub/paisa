<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Paisa</title>
<meta name="description" content="A simple money tracker: accounts, payday months and useful reports.">
<meta name="theme-color" content="#166548">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#15201b; --mute:#63706a; --line:#e2e7e4;
  --acc:#166548; --acc-soft:#e3f1ea; --bad:#c0392b; --bad-soft:#fbe9e6; --pay:#b7791f; --pay-soft:#fbf1dc;
  --good:#166548; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --big:#6250d6; --big-soft:#eeebfb; --inc:#0f8a4f; --inc-soft:#dff3e8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s0:#8a948f;
}
[data-theme="dark"]{
  --bg:#0b0e0d; --card:#1b2320; --ink:#f1f5f3; --mute:#a3b0a9; --line:#2f3b35;
  --acc:#4cc38a; --acc-soft:#1a3b2e; --bad:#ff8a7a; --bad-soft:#3f201b; --pay:#f0b755; --pay-soft:#3a2e15;
  --good:#4cc38a; --shadow:0 0 0 1px #262f2b;
  --big:#a79ef0; --big-soft:#26223f; --inc:#4cd695; --inc-soft:#173a2a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767; --s0:#74807a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:700}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.monthnav button{width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--mute)}
.monthnav button:disabled{opacity:.25}
.monthnav span{min-width:86px;text-align:center;font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.bad{color:var(--bad)} .good{color:var(--good)} .pay{color:var(--pay)}
.meter{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 6px;position:relative}
.meter i{display:block;height:100%;background:var(--acc);border-radius:999px}
.meter.over i{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.kv+.kv{border-top:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.acct{flex:1 1 30%;min-width:96px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.acct b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct span{font-size:13px;color:var(--acc);font-variant-numeric:tabular-nums}
.entry{display:flex;gap:10px;align-items:center;padding:10px 0;width:100%;text-align:left}
.entry+.entry,.daygrp .entry{border-top:1px solid var(--line)}
.dot{--c:var(--s0);width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.dot svg{width:21px;height:21px}
.dot.sm{width:30px;height:30px;border-radius:10px}.dot.sm svg{width:17px;height:17px}
.dot.inc{background:var(--inc-soft);color:var(--inc)} .dot.tr{background:var(--line);color:var(--mute)}
.entry.inc .a{color:var(--inc)} .entry.tr .a{color:var(--mute)}
.entry.lg{background:var(--big-soft);box-shadow:inset 3px 0 0 var(--big);border-radius:10px;margin:3px -8px;padding:10px 8px;width:calc(100% + 16px);border-top-color:transparent!important}
.entry.lg+.entry{border-top-color:transparent}
.entry.lg .a{font-weight:800}
.tag.b{background:var(--big);color:var(--card)}
.kv.tap{width:100%;text-align:left;align-items:center}
.kv.tap>span:first-child::after{content:" ›";color:var(--mute)}
button.card{display:block;width:calc(100%);text-align:left}
.donutwrap{display:flex;justify-content:center;margin:6px 0 10px}
.donut{width:190px;height:190px}
.donut{cursor:pointer}.donut circle.seg{fill:none;stroke-width:26}
.donut text{fill:var(--ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.catrow .row{gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.icons button{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute)}
.icons button svg{width:20px;height:20px}
.icons button.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.entry .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .a{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--pay-soft);color:var(--pay);vertical-align:1px;margin-left:4px}
.tag.s{background:var(--acc-soft);color:var(--acc)}
.dayhdr{font-size:12px;color:var(--mute);font-weight:600;padding:12px 0 4px;display:flex;justify-content:space-between}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center}
nav.tabs button{flex:1;padding:6px 0;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc);font-weight:700}
nav.tabs .add{flex:none;width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;font-size:30px;line-height:1;margin:-18px 8px 0;box-shadow:0 6px 16px rgba(22,101,72,.35);display:grid;place-items:center}
[data-theme="dark"] nav.tabs .add{color:#0f1412}
.sheetwrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94dvh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;margin-bottom:10px}
.sheet .hd h3{flex:1;margin:0;font-size:17px}
.x{width:36px;height:36px;border-radius:50%;background:var(--card);font-size:18px;color:var(--mute)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
[data-theme="dark"] .seg button.on{color:#0f1412}
.amt{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 14px;margin:10px 0;border:1px solid var(--line)}
.amt span{color:var(--mute);font-weight:600}
.amt input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:28px;font-weight:750;font-variant-numeric:tabular-nums}
.ops{display:flex;gap:6px}
.ops button{width:34px;height:34px;border-radius:10px;background:var(--bg);font-size:17px;color:var(--mute)}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:12px 2px 6px}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.pick button{display:inline-flex;align-items:center;gap:6px}.pick .ci{display:inline-grid}.pick .ci svg{width:17px;height:17px}
.pick button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.field{display:flex;gap:8px;margin-top:10px}
.field input,.field select,.inp{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:0;width:100%}
.inp:focus,.field input:focus{border-color:var(--acc)}
.sw{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;width:100%;text-align:left}
.sw .grow b{display:block;font-size:14px} .sw .grow span{font-size:12.5px;color:var(--mute)}
.tog{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on .tog{background:var(--acc)} .sw.on .tog::after{left:21px}
.sw.on.payout .tog{background:var(--pay)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;margin-top:14px;text-align:center}
[data-theme="dark"] .btn{color:#0f1412}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;margin:0;font-size:14px;border-radius:10px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;margin-top:5px}
.bar{--c:var(--acc)}.bar i{display:block;height:100%;background:var(--c)} .bar i.p{opacity:.4;margin-left:2px}
.catrow{display:block;width:100%;text-align:left;padding:9px 0}
.catrow+.catrow{border-top:1px solid var(--line)}
.note{background:var(--acc-soft);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
.note.w{background:var(--bad-soft)} .note.p{background:var(--pay-soft)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--mute);margin-right:5px}
.legend i.p{opacity:.4}
.delta{font-size:12px;color:var(--mute)}
.mrow{padding:8px 0}.mrow+.mrow{border-top:1px solid var(--line)}
.mbar{height:10px;border-radius:999px;background:var(--line);position:relative;margin-top:5px}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--acc)}
.mbar i.o{background:var(--bad)}
.mbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11.5px;color:var(--mute);text-align:right;font-weight:600;padding:4px 0}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90%;text-align:center}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#lock .pins{display:flex;gap:12px} #lock .pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)} #lock .pins i.f{background:var(--acc)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
#lock .pad button{height:60px;border-radius:18px;background:var(--card);font-size:22px;font-weight:600}
.list button.li{display:flex;width:100%;align-items:center;gap:10px;padding:12px 0;text-align:left}
.list button.li+button.li{border-top:1px solid var(--line)}
.list .li .grow b{display:block}.list .li .grow span{font-size:12.5px;color:var(--mute)}
.chev{color:var(--mute)}
.filters{display:flex;gap:8px;margin:4px 0 2px}
.filters select{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" hidden>
<script src="xlsx.full.min.js"></script>
<script>
"use strict";
/* ---------- storage ---------- */
const LS='paisa.v2';
const DEF_EXP=['Food & Drink','Bills & Utilities','Fuel & Maintenance','Personal','Family','Shopping','Grocery','Office','Gifts','Committee','CC Bill','Loan Paid','Medical','Transport','Other Expenses'];
const DEF_INC=['Salary','Other Income'];
let uidc=0; const uid=()=>Date.now().toString(36)+(uidc++).toString(36)+Math.random().toString(36).slice(2,5);
function fresh(){return {v:2,accounts:[],categories:[...DEF_EXP.map(n=>({id:uid(),name:n,type:'expense'})),...DEF_INC.map(n=>({id:uid(),name:n,type:'income'}))],entries:[],settings:{theme:'auto',pin:null,lastBackup:null,started:false},mem:{}};}
let S; try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){S=null}
if(!S||!S.entries) S=fresh();
S.mem=S.mem||{}; S.settings=S.settings||{theme:'auto'};
let saveFailed=false;
function save(){try{localStorage.setItem(LS,JSON.stringify(S));saveFailed=false}catch(e){saveFailed=true;toast('Could not save on this device. Make a backup now.')}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'Rs '+Math.round(n).toLocaleString('en-US');
const fnum=n=>Math.round(n).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const nice=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+', '+DOW[d.getDay()]};
const acc=id=>S.accounts.find(a=>a.id===id);
const cat=id=>S.categories.find(c=>c.id===id);
const accName=id=>(acc(id)||{name:'(removed)'}).name;
const catName=id=>(cat(id)||{name:'No category'}).name;
const isSalary=e=>e.type==='income'&&(e.startsMonth||/^salary$/i.test(catName(e.cat)));
function toast(m){const t=$('#toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',2600)}

/* ---------- category icons and colours ---------- */
const CI={
 food:'<path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2.5 5-2.5 8H17v10"/>',
 bill:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',
 fuel:'<path d="M5 21V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16M4 21h11M7 7h5v4H7zM14 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
 person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 family:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17 14.6a5.5 5.5 0 0 1 5 6.4"/>',
 bag:'<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/>',
 cart:'<path d="M3 4h2l2.5 11h10L20 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
 work:'<path d="M3 8h18v12H3zM9 8V5h6v3M3 13h18"/>',
 gift:'<path d="M4 11h16v10H4zM3 7h18v4H3zM12 7v14M12 7c-1.5-4-6-3.5-5-1 .6 1.5 3 1 5 1zM12 7c1.5-4 6-3.5 5-1-.6 1.5-3 1-5 1z"/>',
 cycle:'<path d="M4 12a8 8 0 0 1 14-5.3L20 5v5h-5M20 12a8 8 0 0 1-14 5.3L4 19v-5h5"/>',
 card:'<path d="M2 6h20v12H2zM2 10h20M6 15h4"/>',
 loan:'<circle cx="12" cy="12" r="9"/><path d="M12 16V8M9 11l3-3 3 3"/>',
 medical:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
 bus:'<path d="M5 16V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10zM5 11h14M8 16v3M16 16v3"/>',
 dots:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
 wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14h.01"/>',
 plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
 swap:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
 home:'<path d="M3 11l9-8 9 8v10H3zM10 21v-6h4v6"/>',
 phone:'<path d="M8 2h8a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM11 18h2"/>',
 play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>',
 plane:'<path d="M3 13l18-8-6 16-3-7z"/>',
 book:'<path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-5a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h5z"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="8" cy="9" r="1.2"/>'
};
const CMAP=[[/cc bill|credit|card/,'card',7],[/bill|utilit|subscription/,'bill',1],[/food|drink|restaurant|dining|eat/,'food',2],[/fuel|maint|petrol|car|bike/,'fuel',8],[/personal/,'person',7],[/family/,'family',5],[/shop|cloth/,'bag',4],[/grocer/,'cart',3],[/office|work|business|freelance/,'work',1],[/gift|salami/,'gift',5],[/committee/,'cycle',6],[/loan|install|debt/,'loan',3],[/medic|health|doctor/,'medical',8],[/transport|ride|taxi/,'bus',2],[/salary|pay/,'wallet',6],[/income|bonus|received/,'plus',3],[/home|rent/,'home',4],[/mobile|phone/,'phone',1],[/entertain|movie|game/,'play',7],[/travel|trip/,'plane',2],[/educat|school|course/,'book',1],[/donat|charity|wedding/,'heart',5],[/other/,'dots',8]];
function catLook(c){if(!c)return {icon:'tag',col:0};let icon=c.icon,col=c.col;if(!icon||!col){const n=c.name.toLowerCase();const m=CMAP.find(x=>x[0].test(n));if(!icon)icon=m?m[1]:'tag';if(!col)col=m?m[2]:(S.categories.indexOf(c)%8)+1}return {icon,col}}
const gsvg=(k,w)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.8)+'" stroke-linecap="round" stroke-linejoin="round">'+(CI[k]||CI.tag)+'</svg>';
function catDot(id,sm){const l=catLook(cat(id));return `<span class="dot ${sm?'sm':''}" style="--c:var(--s${l.col})">${gsvg(l.icon)}</span>`}
const bigAt=()=>+S.settings.bigAt>0?+S.settings.bigAt:50000;

/* ---------- months that start on payday ---------- */
function labelFor(s){const d=pd(s);let y=d.getFullYear(),m=d.getMonth();if(d.getDate()>=15){m++;if(m>11){m=0;y++}}return {key:y+'-'+pad(m+1),label:MON[m]+' '+y}}
function calLabel(y,m){return {key:y+'-'+pad(m+1),label:MON[m]+' '+y}}
function cycles(){
  const starts=[...new Set(S.entries.filter(e=>e.type==='income'&&e.startsMonth).map(e=>e.date))].sort();
  const bs=[];
  for(const d of starts){const l=labelFor(d);if(!bs.length||l.key>bs[bs.length-1].key)bs.push({start:d,key:l.key,label:l.label})}
  const dates=S.entries.map(e=>e.date).sort();
  const first=dates[0]||today();
  const out=[];
  const calUntil=(from,stop)=>{ // calendar months from `from` up to (not including) `stop` (or through today if stop null)
    let d=pd(from);d=new Date(d.getFullYear(),d.getMonth(),1);
    const lim=stop||addDays(today(),1);
    while(iso(d)<lim){const nx=new Date(d.getFullYear(),d.getMonth()+1,1);const l=calLabel(d.getFullYear(),d.getMonth());
      out.push({start:iso(d),end:(stop&&iso(nx)>stop)?stop:iso(nx),key:l.key,label:l.label,cal:true});d=nx}
  };
  if(!bs.length){calUntil(first<today()?first:today(),null);const last=out[out.length-1];if(last)last.end=null;return fix(out)}
  if(first<bs[0].start)calUntil(first,bs[0].start);
  if(out.length&&out[out.length-1].key>=bs[0].key){const p=out.pop();bs[0]={...bs[0],start:p.start}}
  bs.forEach((b,i)=>out.push({start:b.start,end:bs[i+1]?bs[i+1].start:null,key:b.key,label:b.label}));
  return fix(out);
  function fix(a){if(!a.length){const t=new Date();const l=calLabel(t.getFullYear(),t.getMonth());a.push({start:iso(new Date(t.getFullYear(),t.getMonth(),1)),end:null,key:l.key,label:l.label,cal:true})}return a}
}
const inCyc=(c,d)=>d>=c.start&&(!c.end||d<c.end);
function cycStats(c){
  const es=S.entries.filter(e=>inCyc(c,e.date));
  const r={es,salary:0,extra:0,spent:0,payout:0,exp:[]};
  for(const e of es){
    if(e.type==='income'){if(isSalary(e))r.salary+=e.amount;else r.extra+=e.amount}
    else if(e.type==='expense'){r.exp.push(e);if(e.payout)r.payout+=e.amount;else r.spent+=e.amount}
  }
  r.left=r.salary-r.spent; r.total=r.spent+r.payout;
  return r;
}
function balances(){const b={};S.accounts.forEach(a=>b[a.id]=+a.opening||0);
  for(const e of S.entries){if(e.type==='income')b[e.acc]=(b[e.acc]||0)+e.amount;else if(e.type==='expense')b[e.acc]=(b[e.acc]||0)-e.amount;else{b[e.acc]=(b[e.acc]||0)-e.amount;b[e.toAcc]=(b[e.toAcc]||0)+e.amount}}
  return b}

/* ---------- view state ---------- */
let V={tab:'home',key:null,q:'',fAcc:'',fCat:'',sheet:null};
function curCycles(){const cs=cycles();let i=cs.findIndex(c=>c.key===V.key);if(i<0){i=cs.findIndex(c=>inCyc(c,today()));if(i<0)i=cs.length-1;V.key=cs[i].key}return {cs,i,c:cs[i]}}
const ICON={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',list:'<path d="M4 6h16M4 12h16M4 18h10"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.2-1.3L14 3h-4l-.4 2.5a7 7 0 0 0-2.2 1.3l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .9.1 1.3l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.2 1.3L10 21h4l.4-2.5a7 7 0 0 0 2.2-1.3l2.3 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/>'};
const svg=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICON[n]+'</svg>';
function renderTabs(){const t=(id,ic,l)=>`<button data-act="tab" data-id="${id}" class="${V.tab===id?'on':''}">${svg(ic)}${l}</button>`;
  $('#tabs').innerHTML=t('home','home','Home')+t('entries','list','Entries')+'<button class="add" data-act="add" aria-label="Add entry">+</button>'+t('reports','chart','Reports')+t('settings','gear','Settings')}
function monthNav(){const {cs,i,c}=curCycles();return `<div class="monthnav"><button data-act="cyc" data-d="-1" ${i<=0?'disabled':''} aria-label="Previous month">‹</button><span>${esc(c.label)}</span><button data-act="cyc" data-d="1" ${i>=cs.length-1?'disabled':''} aria-label="Next month">›</button></div>`}
function head(title,nav=true){return `<header class="top"><h1>${title}</h1>${nav?monthNav():''}</header>`}

/* ---------- entry row ---------- */
function entryRow(e,showDate){
  let t,s,a,cls='',dot;
  if(e.type==='transfer'){t='Transfer';s=accName(e.acc)+' → '+accName(e.toAcc);a=fmt(e.amount);cls='tr';dot='<span class="dot tr">'+gsvg('swap')+'</span>'}
  else{t=catName(e.cat);s=accName(e.acc);a=(e.type==='expense'?'−':'+')+fmt(e.amount);if(e.type==='income'){cls='inc';dot='<span class="dot inc">'+gsvg(catLook(cat(e.cat)).icon)+'</span>'}else dot=catDot(e.cat)}
  const big=e.amount>=bigAt()&&e.type!=='transfer';
  const tags=(e.payout?'<span class="tag">payout</span>':'')+(e.type==='income'&&e.startsMonth?'<span class="tag s">starts month</span>':'')+(big?'<span class="tag b">large</span>':'');
  const sub=[s,e.note,showDate?nice(e.date):''].filter(Boolean).map(esc).join(' · ');
  return `<button class="entry ${cls} ${big?'lg':''}" data-act="edit" data-id="${e.id}">${dot}<span class="grow" style="flex:1;min-width:0"><div class="t">${esc(t)}${tags}</div><div class="s">${sub}</div></span><span class="a">${a}</span></button>`}
const sortE=es=>es.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));

/* ---------- HOME ---------- */
function expectedEnd(c){if(c.end)return c.end;const d=pd(c.start);if(c.cal)return iso(new Date(d.getFullYear(),d.getMonth()+1,1));return iso(new Date(d.getFullYear(),d.getMonth()+1,d.getDate()))}
function meterCard(c,st,isCur){
  if(!st.salary){return `<div class="card"><h2>Spent this month</h2><div class="big num">${fmt(st.spent)}</div><div class="sub">No salary logged for ${esc(c.label)} yet. Add it as Income with “starts new month” on, and the meter appears.</div>${st.payout?`<div class="kv" style="margin-top:8px"><span class="pay">Paid from payout</span><b class="num">${fmt(st.payout)}</b></div>`:''}</div>`}
  const pct=Math.min(100,st.spent/st.salary*100),over=st.left<0;
  let line;
  if(over)line=`<b class="bad">You’ve spent ${fmt(-st.left)} more than your salary.</b>`;
  else if(isCur){const dl=Math.max(1,daysBetween(today(),expectedEnd(c)));line=`${fmt(st.left)} left · about <b>${fmt(st.left/dl)}</b> a day for ${dl} day${dl>1?'s':''}`}
  else line=`Finished ${fmt(st.left)} under salary`;
  return `<button class="card" data-act="rlist" data-k="spent"><h2>Spent from salary ›</h2><div class="row"><div class="big num grow ${over?'bad':''}">${fmt(st.spent)}</div><div class="sub num">of ${fmt(st.salary)}</div></div><div class="meter ${over?'over':''}"><i style="width:${pct}%"></i></div><div class="sub">${line}</div>${st.payout?`<div class="kv" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><span class="pay">Paid from payout (not counted)</span><b class="num">${fmt(st.payout)}</b></div>`:''}</button>`}
function renderHome(){
  const {cs,i,c}=curCycles(),st=cycStats(c),isCur=inCyc(c,today()),b=balances();
  const open=S.accounts.filter(a=>!a.closed);const total=S.accounts.reduce((s,a)=>s+(b[a.id]||0),0);
  let h=head('Paisa');
  if(!S.entries.length&&!S.settings.started)h+=`<div class="card"><h2>Welcome</h2><p style="margin:0 0 4px">Bring your history over, or start empty.</p><button class="btn" data-act="import">Import from Hysab Kytab</button><button class="btn ghost" data-act="restore">Restore a Paisa backup</button><button class="btn ghost" data-act="startempty">Start empty</button></div>`;
  if(isCur&&!c.cal&&daysBetween(c.start,today())>35)h+=`<div class="note p">This month has run ${daysBetween(c.start,today())} days. Log your salary with “starts new month” on to begin the next one.</div>`;
  h+=meterCard(c,st,isCur);
  h+=`<div class="card"><h2>What you have</h2><div class="big num" style="font-size:24px">${fmt(total)}</div><div class="chips" style="margin-top:10px">${open.map(a=>`<button class="acct" data-act="acctview" data-id="${a.id}"><b>${esc(a.name)}</b><span>${fmt(b[a.id]||0)}</span></button>`).join('')||'<span class="sub">No accounts yet. Add one in Settings.</span>'}</div></div>`;
  const rec=sortE(st.es).slice(0,6);
  h+=`<div class="card"><h2>Recent</h2>${rec.map(e=>entryRow(e,true)).join('')||'<div class="empty">Nothing logged in '+esc(c.label)+' yet.<br>Tap + to add an entry.</div>'}${st.es.length>6?'<button class="btn ghost" data-act="tab" data-id="entries">See all '+st.es.length+'</button>':''}</div>`;
  return h}

/* ---------- ENTRIES ---------- */
function renderEntries(){
  const {c}=curCycles();const q=V.q.trim().toLowerCase();
  let es=q?S.entries:S.entries.filter(e=>inCyc(c,e.date));
  if(q)es=es.filter(e=>(e.note||'').toLowerCase().includes(q)||catName(e.cat).toLowerCase().includes(q)||accName(e.acc).toLowerCase().includes(q)||String(e.amount).includes(q));
  if(V.fAcc)es=es.filter(e=>e.acc===V.fAcc||e.toAcc===V.fAcc);
  if(V.fCat)es=es.filter(e=>e.cat===V.fCat);
  es=sortE(es);
  let h=head('Entries',!q);
  h+=`<input class="inp" id="q" placeholder="Search all entries" value="${esc(V.q)}" autocomplete="off"><div class="filters"><select id="fAcc"><option value="">All accounts</option>${S.accounts.map(a=>`<option value="${a.id}" ${V.fAcc===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><select id="fCat"><option value="">All categories</option>${S.categories.map(x=>`<option value="${x.id}" ${V.fCat===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
  if(!es.length)return h+'<div class="empty">No entries match.</div>';
  const sum=es.reduce((s,e)=>s+(e.type==='expense'?e.amount:0),0);
  h+=`<div class="sub" style="margin:8px 2px">${es.length} entr${es.length>1?'ies':'y'} · spent ${fmt(sum)}</div><div class="card" style="padding-top:2px">`;
  let last='';
  for(const e of es){if(e.date!==last){const day=es.filter(x=>x.date===e.date&&x.type==='expense').reduce((s,x)=>s+x.amount,0);h+=`<div class="dayhdr"><span>${nice(e.date)}${q?' '+pd(e.date).getFullYear():''}</span><span class="num">${day?'−'+fmt(day):''}</span></div><div class="daygrp">`;last=e.date}
    h+=entryRow(e,false);const nx=es[es.indexOf(e)+1];if(!nx||nx.date!==e.date)h+='</div>'}
  return h+'</div>'}

/* ---------- REPORTS ---------- */
const normNote=n=>(n||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function catTotals(st){const m={};for(const e of st.exp){const k=e.cat||'';m[k]=m[k]||{s:0,p:0,n:0};if(e.payout)m[k].p+=e.amount;else m[k].s+=e.amount;m[k].n++}return m}
function renderReports(){
  const {cs,i,c}=curCycles(),st=cycStats(c),isCur=inCyc(c,today());
  let h=head('Reports');
  if(!st.es.length)return h+'<div class="empty">Nothing logged in '+esc(c.label)+' yet.</div>';
  const prior=cs.slice(Math.max(0,i-6),i).map(x=>({c:x,st:cycStats(x)})).filter(x=>x.st.es.length);
  const prev=prior.length?prior[prior.length-1]:null;
  const ct=catTotals(st);const rows=Object.entries(ct).map(([k,v])=>({k,...v,t:v.s+v.p})).sort((a,b)=>b.t-a.t);
  const avg={};if(prior.length){for(const p of prior){const m=catTotals(p.st);for(const k in m)avg[k]=(avg[k]||0)+m[k].s+m[k].p}for(const k in avg)avg[k]/=prior.length}
  const prevCt=prev?catTotals(prev.st):null;
  // projection
  let proj=null;const elapsed=Math.max(1,daysBetween(c.start,isCur?today():(c.end||today()))+(isCur?1:0));const len=Math.max(elapsed,daysBetween(c.start,expectedEnd(c)));
  if(isCur&&st.salary&&elapsed>=7){const big=Math.max(10000,st.salary*0.1);let one=0,every=0;for(const e of st.exp){if(e.payout)continue;if(e.amount>=big||/committee|loan|cc bill|rent|install/i.test(catName(e.cat)))one+=e.amount;else every+=e.amount}proj=one+every/elapsed*len}
  // groups by note
  const g={};for(const e of st.exp){const k=normNote(e.note);if(!k)continue;g[k]=g[k]||{n:0,s:0,label:e.note.trim()};g[k].n++;g[k].s+=e.amount}
  const reps=Object.values(g).filter(x=>x.n>=2).sort((a,b)=>b.s-a.s);
  // stands out
  const notes=[];
  if(st.salary){if(st.left<0)notes.push(['w',`You’ve spent <b>${fmt(-st.left)}</b> more than your salary this month.`]);
    else if(proj!=null)notes.push([proj>st.salary?'w':'',proj>st.salary?`At this pace you’ll finish about <b>${fmt(proj-st.salary)}</b> over your salary.`:`At this pace you’ll finish about <b>${fmt(st.salary-proj)}</b> under your salary.`])}
  if(prior.length){let best=null;for(const r of rows){const a=avg[r.k]||0;if(a>0&&r.t-a>2000&&r.t>a*1.25&&(!best||r.t-a>best.d))best={d:r.t-a,r,a}}if(best)notes.push(['',`<b>${esc(catName(best.r.k))}</b> is ${Math.round((best.r.t/best.a-1)*100)}% above your usual (${fmt(best.r.t)} against ${fmt(best.a)}).`])}
  if(reps.length)notes.push(['',`Small repeats add up: <b>${esc(reps[0].label)}</b> ${reps[0].n} times came to ${fmt(reps[0].s)}.`]);
  const bigE=st.exp.slice().sort((a,b)=>b.amount-a.amount)[0];
  if(bigE&&st.total&&bigE.amount/st.total>=0.25)notes.push(['p',`<b>${esc(bigE.note||catName(bigE.cat))}</b> alone is ${Math.round(bigE.amount/st.total*100)}% of everything spent this month${bigE.payout?' (paid from payout)':''}.`]);
  h+=`<div class="card"><h2>What stands out</h2>${notes.slice(0,3).map(n=>`<div class="note ${n[0]}">${n[1]}</div>`).join('')||'<div class="sub">Nothing unusual so far.</div>'}</div>`;
  // salary
  h+=`<div class="card"><h2>Am I within my salary?</h2>${st.salary?`<button class="kv tap" data-act="rlist" data-k="salary"><span>Salary</span><b class="num">${fmt(st.salary)}</b></button><button class="kv tap" data-act="rlist" data-k="spent"><span>Spent from salary</span><b class="num">${fmt(st.spent)}</b></button><div class="kv"><span>${st.left<0?'Over by':'Left'}</span><b class="num ${st.left<0?'bad':'good'}">${fmt(Math.abs(st.left))}</b></div>${proj!=null?`<div class="kv"><span>Estimated at month end</span><b class="num ${proj>st.salary?'bad':''}">${fmt(proj)}</b></div>`:(isCur?'<div class="sub" style="padding-top:6px">A month-end estimate appears after a week of entries.</div>':'')}`:`<div class="sub">No salary logged for this month.</div><button class="kv tap" data-act="rlist" data-k="spent"><span>Spent so far</span><b class="num">${fmt(st.spent)}</b></button>`}</div>`;
  // payout pot (all time)
  let potIn=0,potOut=0;for(const e of S.entries){if(e.type==='income'&&!isSalary(e))potIn+=e.amount;if(e.type==='expense'&&e.payout)potOut+=e.amount}
  if(potIn||potOut)h+=`<div class="card"><h2>Payout and other income</h2><button class="kv tap" data-act="rlist" data-k="potin"><span>Received so far</span><b class="num">${fmt(potIn)}</b></button><button class="kv tap" data-act="rlist" data-k="potout"><span>Spent from it</span><b class="num pay">${fmt(potOut)}</b></button><div class="kv"><span>${potIn-potOut<0?'Overspent by':'Remaining'}</span><b class="num ${potIn-potOut<0?'bad':''}">${fmt(Math.abs(potIn-potOut))}</b></div><div class="sub" style="padding-top:6px">All months together. This month: received ${fmt(st.extra)}, spent ${fmt(st.payout)}.</div></div>`;
  // categories: donut + list
  const top=rows.slice(0,6),rest=rows.slice(6);const segs=top.map(r=>({k:r.k,v:r.t,col:catLook(cat(r.k)).col}));if(rest.length)segs.push({k:'__other',v:rest.reduce((a,r)=>a+r.t,0),col:0});
  // keep look-alike colours from sitting next to each other on the ring
  const clash=(x,y)=>x&&y&&(x.col===y.col||[[5,8],[2,4],[1,7],[3,6]].some(p=>p.includes(x.col)&&p.includes(y.col)));
  for(let j=0;j<segs.length-2;j++)if(clash(segs[j],segs[j+1])&&!clash(segs[j],segs[j+2])){const t=segs[j+1];segs[j+1]=segs[j+2];segs[j+2]=t}
  const R=70,C=2*Math.PI*R;let off=0;const gap=segs.length>1?2.5:0;
  const arcs=segs.map(g=>{const len=Math.max(0.5,g.v/st.total*C-gap);const o=`<circle class="seg" cx="100" cy="100" r="${R}" stroke="var(--s${g.col})" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(g.k==='__other'?'Other categories':catName(g.k))}: ${fmt(g.v)}</title></circle>`;off+=g.v/st.total*C;return o}).join('');
  DONUT=segs.map(g=>({k:g.k,f:g.v/st.total}));
  const max=rows.length?rows[0].t:1;
  h+=`<div class="card"><h2>Where did it go?</h2><div class="donutwrap"><svg class="donut" data-act="donut" viewBox="0 0 200 200" role="img" aria-label="Spending by category">${arcs}<text x="100" y="96" font-size="11" style="fill:var(--mute)">Spent in ${esc(c.label)}</text><text x="100" y="118" font-size="19" font-weight="750">${fmt(st.total)}</text></svg></div>${st.payout?'<div class="legend" style="justify-content:center"><span><i></i>From salary</span><span><i class="p"></i>From payout</span></div>':''}${rows.map(r=>{const l=catLook(cat(r.k));let d='';if(prevCt){const pv=prevCt[r.k]?prevCt[r.k].s+prevCt[r.k].p:0;const df=r.t-pv;d=`<div class="delta">${pv?(df>=0?'▲ ':'▼ ')+fmt(Math.abs(df))+' vs '+esc(prev.c.label):'new this month'}${avg[r.k]&&prior.length>1?' · usual '+fmt(avg[r.k]):''}</div>`}
    return `<button class="catrow" data-act="catview" data-id="${r.k}"><div class="row">${catDot(r.k,true)}<span class="grow" style="flex:1;min-width:0"><div class="row" style="gap:6px"><span class="grow" style="flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(catName(r.k))} <span class="sub">· ${r.n}</span></span><b class="num">${fmt(r.t)}</b><span class="sub num" style="width:34px;text-align:right">${Math.round(r.t/st.total*100)}%</span></div><div class="bar" style="--c:var(--s${l.col})"><i style="width:${r.s/max*100}%"></i>${r.p?`<i class="p" style="width:${r.p/max*100}%"></i>`:''}</div>${d}</span></div></button>`}).join('')}</div>`;
  // repeats
  h+=`<div class="card"><h2>What adds up?</h2>${reps.length?`<table class="t"><tr><th>Note</th><th>Times</th><th>Total</th></tr>${reps.slice(0,8).map(r=>`<tr data-act="rlist" data-k="note" data-id="${esc(normNote(r.label))}"><td>${esc(r.label)} ›</td><td>${r.n}</td><td>${fmt(r.s)}</td></tr>`).join('')}</table>`:'<div class="sub">No repeated notes this month. Entries with the same note are grouped here.</div>'}</div>`;
  // monthly payments: same note seen in 2+ months
  const seen={};cs.forEach(x=>{const m={};for(const e of S.entries)if(e.type==='expense'&&inCyc(x,e.date)){const k=normNote(e.note);if(k)m[k]=(m[k]||0)+e.amount}for(const k in m){seen[k]=seen[k]||[];seen[k].push(m[k])}});
  const monthly=Object.entries(seen).filter(([k,v])=>v.length>=2&&g[k]).map(([k,v])=>({label:g[k].label,now:g[k].s,avg:v.reduce((a,b)=>a+b,0)/v.length})).sort((a,b)=>b.now-a.now);
  h+=`<div class="card"><h2>What do I pay every month?</h2>${monthly.length?`<table class="t"><tr><th>Payment</th><th>This month</th><th>Usual</th></tr>${monthly.slice(0,12).map(r=>`<tr data-act="rlist" data-k="note" data-id="${esc(normNote(r.label))}"><td>${esc(r.label)} ›</td><td>${fmt(r.now)}</td><td>${fmt(r.avg)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${fmt(monthly.reduce((s,r)=>s+r.now,0))}</b></td><td></td></tr></table>`:'<div class="sub">This fills in once the same note appears in two different months, for example a subscription.</div>'}</div>`;
  // accounts

  // biggest
  h+=`<div class="card"><h2>Biggest expenses</h2>${st.exp.slice().sort((a,b)=>b.amount-a.amount).slice(0,5).map(e=>entryRow(e,true)).join('')}</div>`;

/* entry form */
let F=null;
function usage(type){const m={};const from=addDays(today(),-120);for(const e of S.entries)if(e.type===type&&e.date>=from)m[e.cat]=(m[e.cat]||0)+1;return m}
function openEntry(id){
  const e=id?S.entries.find(x=>x.id===id):null;const open=S.accounts.filter(a=>!a.closed);
  if(!S.accounts.length){toast('Add an account first, in Settings.');V.tab='settings';render();return}
  F=e?{...e,amount:String(e.amount),edit:true}:{type:'expense',amount:'',date:today(),note:'',cat:null,acc:null,toAcc:null,payout:false,startsMonth:false};
  if(!e)setDefaults();
  drawEntry()}
function setDefaults(){const m=S.mem;const open=S.accounts.filter(a=>!a.closed);const ok=id=>open.some(a=>a.id===id);
  if(F.type==='transfer'){F.acc=ok(m.trFrom)?m.trFrom:(open[0]||{}).id;F.toAcc=ok(m.trTo)&&m.trTo!==F.acc?m.trTo:(open.find(a=>a.id!==F.acc)||{}).id||null;F.cat=null}
  else{const k=F.type==='expense'?'expAcc':'incAcc';F.acc=ok(m[k])?m[k]:(open[0]||{}).id;const ck=F.type==='expense'?'expCat':'incCat';const c=cat(m[ck]);F.cat=c&&!c.hidden&&c.type===F.type?c.id:null;
    if(F.type==='income'&&!F.cat){const s=S.categories.find(x=>x.type==='income'&&/^salary$/i.test(x.name));if(s)F.cat=s.id}}
  F.payout=false;F.startsMonth=F.type==='income'&&F.cat&&/^salary$/i.test(catName(F.cat))}
function drawEntry(){
  const open=S.accounts.filter(a=>!a.closed||a.id===F.acc||a.id===F.toAcc);
  const u=usage(F.type);const cats=S.categories.filter(c=>c.type===F.type&&(!c.hidden||c.id===F.cat)).map((c,i)=>({c,i})).sort((a,b)=>(u[b.c.id]||0)-(u[a.c.id]||0)||a.i-b.i).map(x=>x.c);
  const accPick=(key,ex)=>`<div class="pick">${open.filter(a=>a.id!==ex).map(a=>`<button data-act="f" data-k="${key}" data-v="${a.id}" class="${F[key]===a.id?'on':''}">${esc(a.name)}</button>`).join('')}</div>`;
  let h=sheetHd(F.edit?'Edit entry':'Add entry');
  h+=`<div class="seg">${[['expense','Expense'],['income','Income'],['transfer','Transfer']].map(([t,l])=>`<button data-act="ftype" data-v="${t}" class="${F.type===t?'on':''}">${l}</button>`).join('')}</div>`;
  h+=`<div class="amt"><span>Rs</span><input id="amt" inputmode="decimal" placeholder="0" value="${esc(F.amount)}" autocomplete="off"><div class="ops">${['+','−','×','÷'].map(o=>`<button data-act="op" data-v="${o}" aria-label="${o}">${o}</button>`).join('')}</div></div><div class="sub" id="calc" style="margin:-4px 4px 0;min-height:18px"></div>`;
  if(F.type==='transfer'){h+=`<div class="lbl">From</div>${accPick('acc')}<div class="lbl">To</div>${accPick('toAcc',F.acc)}`}
  else{h+=`<div class="lbl">Category</div><div class="pick">${cats.map(c=>`<button data-act="f" data-k="cat" data-v="${c.id}" class="${F.cat===c.id?'on':''}"><span class="ci" style="color:var(--s${catLook(c).col})">${gsvg(catLook(c).icon)}</span>${esc(c.name)}</button>`).join('')}</div><div class="lbl">${F.type==='expense'?'Paid from':'Received in'}</div>${accPick('acc')}`}
  h+=`<div class="field"><input id="note" placeholder="Note (optional)" value="${esc(F.note||'')}" autocomplete="off"><input id="date" type="date" value="${F.date}" style="flex:0 0 150px"></div>`;
  if(F.type==='expense')h+=`<button class="sw payout ${F.payout?'on':''}" data-act="fsw" data-k="payout"><span class="grow"><b>From payout</b><span>Paid from committee payout or other extra money. Not counted against salary.</span></span><span class="tog"></span></button>`;
  if(F.type==='income'){const l=labelFor(F.date||today());h+=`<button class="sw ${F.startsMonth?'on':''}" data-act="fsw" data-k="startsMonth"><span class="grow"><b>Starts new month</b><span>${F.startsMonth?'This is the salary for <b>'+esc(l.label)+'</b>. That month begins on this date.':'Turn on for salary. Leave off for payouts and other income.'}</span></span><span class="tog"></span></button>`}
  h+=`<button class="btn" data-act="fsave">${F.edit?'Save changes':'Save'}</button>${F.edit?'<button class="btn danger" data-act="fdel">Delete entry</button>':''}`;
  openSheet(h);showCalc();if(!F.edit&&!F.amount)setTimeout(()=>{const a=$('#amt');a&&a.focus()},50)}
function calc(s){s=String(s).replace(/,/g,'').replace(/−/g,'-').replace(/×/g,'*').replace(/÷/g,'/').trim();if(!s)return NaN;if(!/^[0-9+\-*/.() ]+$/.test(s))return NaN;try{const v=Function('"use strict";return ('+s+')')();return typeof v==='number'&&isFinite(v)?Math.round(v*100)/100:NaN}catch(e){return NaN}}
function showCalc(){const el=$('#calc');if(!el)return;const s=F.amount;const v=calc(s);el.textContent=/[+\-−×÷*/]/.test(String(s).slice(1))&&!isNaN(v)?'= '+fmt(v):''}
function syncF(){const a=$('#amt'),n=$('#note'),d=$('#date');if(a)F.amount=a.value;if(n)F.note=n.value;if(d&&d.value)F.date=d.value}
function saveEntry(){
  syncF();const amt=calc(F.amount);
  if(!(amt>0))return toast('Enter an amount.');
  if(F.type==='transfer'){if(!F.acc||!F.toAcc||F.acc===F.toAcc)return toast('Pick two different accounts.')}
  else{if(!F.cat)return toast('Pick a category.');if(!F.acc)return toast('Pick an account.')}
  const e={id:F.edit?F.id:uid(),type:F.type,amount:amt,date:F.date,note:(F.note||'').trim(),acc:F.acc,ts:F.edit?F.ts:Date.now()};
  if(F.type==='transfer')e.toAcc=F.toAcc;else e.cat=F.cat;
  if(F.type==='expense'&&F.payout)e.payout=true;
  if(F.type==='income'&&F.startsMonth)e.startsMonth=true;
  if(F.edit){const i=S.entries.findIndex(x=>x.id===e.id);S.entries[i]=e}else S.entries.push(e);
  const m=S.mem;if(e.type==='transfer'){m.trFrom=e.acc;m.trTo=e.toAcc}else if(e.type==='expense'){m.expAcc=e.acc;m.expCat=e.cat}else{m.incAcc=e.acc;m.incCat=e.cat}
  S.settings.started=true;save();closeSheet();
  const cs=cycles();const c=cs.find(x=>inCyc(x,e.date));if(c)V.key=c.key;
  render();toast(F&&F.edit?'Saved':'Saved')}

function donutTap(ev,svgEl){const r=svgEl.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*200-100,y=(ev.clientY-r.top)/r.height*200-100;const d=Math.hypot(x,y);if(d<50||d>90)return;let ang=Math.atan2(x,-y);if(ang<0)ang+=2*Math.PI;let f=ang/(2*Math.PI),acc=0;for(const g of DONUT){acc+=g.f;if(f<=acc){if(g.k!=='__other')openCatView(g.k);return}}}

/* ---------- files ---------- */
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function saveFile(name,mime,u8){
  if(window.AndroidBridge&&AndroidBridge.saveFile){AndroidBridge.saveFile(name,mime,b64(u8));return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u8],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function pickFile(accept,cb){const f=$('#file');f.value='';f.accept=accept;f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>cb(new Uint8Array(r.result),file.name);r.onerror=()=>toast('Could not read that file.');r.readAsArrayBuffer(file)};f.click()}
function doBackup(){S.settings.lastBackup=today();save();saveFile('paisa-backup-'+today()+'.json','application/json',new TextEncoder().encode(JSON.stringify({app:'paisa',...S})));render();toast('Backup saved. Keep a copy off this phone.')}
function doRestore(){pickFile('.json,application/json',u8=>{try{const d=JSON.parse(new TextDecoder().decode(u8));if(!d||!Array.isArray(d.entries)||!Array.isArray(d.accounts)||!Array.isArray(d.categories))throw 0;
  const go=()=>{delete d.app;S=d;S.mem=S.mem||{};S.settings=S.settings||{};S.settings.started=true;save();V.key=null;applyTheme();closeSheet();render();toast('Restored '+S.entries.length+' entries.')};
  if(S.entries.length){pending=go;confirmSheet('Replace current data?',`This device has ${S.entries.length} entries. Restoring replaces them with the ${d.entries.length} in the backup.`,'pend','Replace')}else go()}catch(e){toast('That is not a Paisa backup file.')}})}
let pending=null;
function doXlsx(){const rows=sortE(S.entries).reverse().map(e=>({Date:e.date,Type:e.type,Amount:e.amount,Category:e.type==='transfer'?'':catName(e.cat),Account:accName(e.acc),'To account':e.toAcc?accName(e.toAcc):'',Note:e.note||'','From payout':e.payout?'yes':'','Starts month':e.startsMonth?'yes':''}));
  const b=balances();const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Entries');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.accounts.map(a=>({Account:a.name,Opening:+a.opening||0,Balance:b[a.id]||0,Closed:a.closed?'yes':''}))),'Accounts');
  saveFile('paisa-'+today()+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})))}

/* Hysab Kytab import */
function cleanCell(v){if(typeof v!=='string')return v;let s=v.replace(/\u0000/g,'');if(s.length>2){let sp=true;for(let i=1;i<s.length;i+=2)if(s[i]!==' '){sp=false;break}if(sp){let t='';for(let i=0;i<s.length;i+=2)t+=s[i];s=t}}return s.trim()}
function sheetRows(wb,name){const ws=wb.Sheets[name];if(!ws)return [];const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).map(r=>r.map(cleanCell));if(!a.length)return [];const hd=a[0].map(x=>String(x));return a.slice(1).filter(r=>r.some(x=>x!=='')).map(r=>{const o={};hd.forEach((k,i)=>o[k]=r[i]);return o})}
function parseHK(u8){
  const wb=XLSX.read(u8,{type:'array'});const act=sheetRows(wb,'ACTIVITIES');if(!act.length||!('Voucher Type' in act[0]))throw new Error('not hk');
  const accs=sheetRows(wb,'ACCOUNT');const out={accounts:[],entries:[],cats:[]};
  const toIso=s=>{const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);if(typeof s==='number'){const d=XLSX.SSF.parse_date_code(s);return d.y+'-'+pad(d.m)+'-'+pad(d.d)}return null};
  const tr=[];let n=0;
  for(const r of act){const type=String(r['Voucher Type']).toLowerCase(),date=toIso(r['Voucher Date']),amt=parseFloat(r['Voucher Amount']);if(!date||!isFinite(amt)||!amt)continue;
    const base={date,note:String(r['Description']||'').trim(),accName:String(r['Account Name']||'').trim(),ord:n++};
    if(type==='transfer')tr.push({...base,amt});
    else if(type==='income'||type==='expense')out.entries.push({...base,type,amount:Math.abs(amt),catName:String(r['Category Name']||'').trim()||(type==='income'?'Other Income':'Other Expenses')})}
  const outs=tr.filter(t=>t.amt<0),ins=tr.filter(t=>t.amt>0);
  for(const o of outs){const i=ins.findIndex(x=>x.date===o.date&&Math.abs(x.amt+o.amt)<0.005);if(i<0)continue;const [inn]=ins.splice(i,1);out.entries.push({date:o.date,note:o.note||inn.note,type:'transfer',amount:-o.amt,accName:o.accName,toName:inn.accName,ord:Math.min(o.ord,inn.ord)})}
  out.unpaired=outs.length-out.entries.filter(e=>e.type==='transfer').length+ins.length;
  const used=new Set();out.entries.forEach(e=>{used.add(e.accName);if(e.toName)used.add(e.toName)});
  for(const a of accs){const name=String(a['Title']||'').trim();if(!name)continue;const op=parseFloat(a['Opening Balance'])||0;if(used.has(name)||op)out.accounts.push({name,opening:op})}
  used.forEach(nm=>{if(nm&&!out.accounts.some(a=>a.name===nm))out.accounts.push({name:nm,opening:0})});
  return out}
function applyHK(p,replace){
  if(replace){S.entries=[];S.accounts=[]}
  const aid={};for(const a of p.accounts){let x=S.accounts.find(y=>y.name.toLowerCase()===a.name.toLowerCase());if(!x){x={id:uid(),name:a.name,opening:a.opening||0};S.accounts.push(x)}else if(replace)x.opening=a.opening||0;aid[a.name]=x.id}
  const cid=(name,type)=>{let c=S.categories.find(y=>y.type===type&&y.name.toLowerCase()===name.toLowerCase());if(!c){c={id:uid(),name,type};S.categories.push(c)}return c.id};
  const sig=e=>[e.date,e.type,e.amount,e.acc,e.toAcc||'',e.cat||'',(e.note||'').toLowerCase()].join('|');
  const have={};S.entries.forEach(e=>{const k=sig(e);have[k]=(have[k]||0)+1});
  let add=0,skip=0;const t0=Date.now();
  for(const r of p.entries.sort((a,b)=>a.ord-b.ord)){const e={id:uid(),type:r.type,amount:r.amount,date:r.date,note:r.note,acc:aid[r.accName],ts:t0+r.ord};
    if(r.type==='transfer')e.toAcc=aid[r.toName];else e.cat=cid(r.catName,r.type);
    if(r.type==='income'&&/^salary$/i.test(r.catName))e.startsMonth=true;
    const k=sig(e);if(have[k]>0){have[k]--;skip++;continue}S.entries.push(e);add++}
  S.settings.started=true;save();return {add,skip}}
function doImport(){pickFile('.xls,.xlsx,application/vnd.ms-excel',u8=>{let p;try{p=parseHK(u8)}catch(e){return toast('That does not look like a Hysab Kytab export.')}
  const fin=rep=>{const r=applyHK(p,rep);V.key=null;closeSheet();render();toast(`Imported ${r.add} entries`+(r.skip?`, skipped ${r.skip} already here`:'')+'.')};
  if(!S.entries.length)return fin(true);
  pendA=()=>fin(false);pendB=()=>fin(true);
  openSheet(sheetHd('Import '+p.entries.length+' entries')+`<p style="margin:4px 2px 0">This device already has ${S.entries.length} entries.</p><button class="btn" data-act="pendA">Add new ones, skip duplicates</button><button class="btn danger" data-act="pendB">Replace everything</button><button class="btn ghost" data-act="close">Cancel</button>`)})}
let pendA=null,pendB=null;

/* ---------- PIN ---------- */
function h4(p){let h=5381;const s='paisa:'+p;for(let k=0;k<2000;k++)for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i)+k)|0;return String(h)}
function showLock(mode){ // mode: unlock | set
  let buf='',first=null;const el=document.createElement('div');el.id='lock';document.body.appendChild(el);
  const draw=msg=>{el.innerHTML=`<b style="font-size:18px">${msg}</b><div class="pins">${[0,1,2,3].map(i=>`<i class="${i<buf.length?'f':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="x">${mode==='set'?'✕':''}</button><button data-n="0">0</button><button data-n="b">⌫</button></div>`};
  const title=()=>mode==='unlock'?'Enter PIN':first==null?'Choose a 4-digit PIN':'Enter it again';
  draw(title());
  el.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const n=b.dataset.n;if(n==='b')buf=buf.slice(0,-1);else if(n==='x'){if(mode==='set')el.remove();return}else if(buf.length<4)buf+=n;
    if(buf.length===4){if(mode==='unlock'){if(h4(buf)===S.settings.pin){el.remove();return}buf='';draw('Wrong PIN. Try again');return}
      if(first==null){first=buf;buf=''}else if(first===buf){S.settings.pin=h4(buf);save();el.remove();render();toast('PIN set.');return}else{first=null;buf='';draw('They did not match. Choose a PIN');return}}
    draw(title())}}
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(S.settings.pin&&hiddenAt&&Date.now()-hiddenAt>120000&&!$('#lock'))showLock('unlock')});

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='bg'){if(ev.target===el)closeSheet();return}
  if(!a)return;
  switch(a){
    case 'tab':V.tab=id;V.q='';window.scrollTo(0,0);render();break;
    case 'cyc':{const {cs,i}=curCycles();const n=cs[i+ +el.dataset.d];if(n){V.key=n.key;render()}break}
    case 'add':openEntry();break;
    case 'edit':openEntry(id);break;
    case 'close':closeSheet();break;
    case 'ftype':syncF();F.type=el.dataset.v;if(!F.edit)setDefaults();else{F.cat=null;if(F.type==='transfer'&&F.toAcc===F.acc)F.toAcc=null}drawEntry();break;
    case 'f':syncF();F[el.dataset.k]=el.dataset.v;if(el.dataset.k==='acc'&&F.toAcc===F.acc)F.toAcc=null;if(el.dataset.k==='cat'&&F.type==='income'&&!F.edit)F.startsMonth=/^salary$/i.test(catName(F.cat));drawEntry();break;
    case 'fsw':syncF();F[el.dataset.k]=!F[el.dataset.k];drawEntry();break;
    case 'op':{const i=$('#amt');i.value+=el.dataset.v;F.amount=i.value;i.focus();showCalc();break}
    case 'fsave':saveEntry();break;
    case 'fdel':S.entries=S.entries.filter(e=>e.id!==F.id);save();closeSheet();render();toast('Deleted');break;
    case 'acctview':openAcctView(id);break;
    case 'catview':openCatView(id);break;
    case 'acctedit':openAcct(id);break;
    case 'acctsave':{const n=$('#an').value.trim();if(!n)return toast('Give the account a name.');if(S.accounts.some(x=>x.id!==id&&x.name.toLowerCase()===n.toLowerCase()))return toast('That name is already used.');const o=calc($('#ao').value)||0;if(id){const x=acc(id);x.name=n;x.opening=o}else S.accounts.push({id:uid(),name:n,opening:o});S.settings.started=true;save();closeSheet();render();break}
    case 'acctclose':{const x=acc(id);x.closed=!x.closed;save();closeSheet();render();break}
    case 'acctdel':S.accounts=S.accounts.filter(x=>x.id!==id);save();closeSheet();render();break;
    case 'catedit':openCat(id,el.dataset.t);break;
    case 'catsave':{const n=$('#cn').value.trim();if(!n)return toast('Give the category a name.');const t=el.dataset.t;if(S.categories.some(x=>x.id!==id&&x.type===t&&x.name.toLowerCase()===n.toLowerCase()))return toast('That name is already used.');if(id){const x=cat(id);x.name=n;x.icon=CE.icon;x.col=+CE.col}else S.categories.push({id:uid(),name:n,type:t,icon:CE.icon,col:+CE.col});save();closeSheet();render();break}
    case 'cecol':CE.name=$('#cn').value;CE.col=+id;drawCat();break;
    case 'ceicon':CE.name=$('#cn').value;CE.icon=id;drawCat();break;
    case 'rlist':reportList(el.dataset.k,id);break;
    case 'donut':donutTap(ev,el);break;
    case 'gocyc':V.key=id;window.scrollTo(0,0);render();break;
    case 'cathide':{const x=cat(id);x.hidden=!x.hidden;save();closeSheet();render();break}
    case 'catdel':S.categories=S.categories.filter(x=>x.id!==id);save();closeSheet();render();break;
    case 'theme':S.settings.theme=id;save();applyTheme();render();break;
    case 'pin':if(S.settings.pin){S.settings.pin=null;save();render();toast('PIN removed.')}else showLock('set');break;
    case 'backup':doBackup();break;
    case 'restore':doRestore();break;
    case 'xlsx':doXlsx();break;
    case 'import':doImport();break;
    case 'startempty':S.settings.started=true;save();render();break;
    case 'wipe':confirmSheet('Wipe all data?','This deletes every entry, account and setting on this device. Save a backup first if you might want it back.','wipego','Wipe everything');break;
    case 'wipego':S=fresh();save();V.key=null;closeSheet();applyTheme();render();break;
    case 'pend':pending&&pending();pending=null;break;
    case 'pendA':pendA&&pendA();break;
    case 'pendB':pendB&&pendB();break;
  }
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='q'){V.q=t.value;render()}
  else if(t.id==='amt'){F.amount=t.value;showCalc()}
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='fAcc'){V.fAcc=t.value;render()}
  else if(t.id==='fCat'){V.fCat=t.value;render()}
  else if(t.id==='date'&&F){syncF();if(F.type==='income')drawEntry()}
  else if(t.id==='bigAt'){const v=calc(t.value);S.settings.bigAt=v>0?v:50000;save();render()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&V.sheet)closeSheet();if(ev.key==='Enter'&&F&&(ev.target.id==='amt'||ev.target.id==='note')){ev.preventDefault();saveEntry()}});

/* ---------- start ---------- */
applyTheme();render();
if(S.settings.pin)showLock('unlock');
if(!window.AndroidBridge&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
