<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Paisa</title>
<meta name="description" content="A simple money tracker: accounts, payday months and useful reports.">
<meta name="theme-color" content="#166548">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#15201b; --mute:#63706a; --line:#e2e7e4;
  --acc:#166548; --acc-soft:#e3f1ea; --bad:#c0392b; --bad-soft:#fbe9e6; --pay:#b7791f; --pay-soft:#fbf1dc;
  --good:#166548; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --big:#6250d6; --big-soft:#eeebfb; --inc:#0f8a4f; --inc-soft:#dff3e8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s0:#8a948f;
}
[data-theme="dark"]{
  --bg:#0b0e0d; --card:#1b2320; --ink:#f1f5f3; --mute:#a3b0a9; --line:#2f3b35;
  --acc:#4cc38a; --acc-soft:#1a3b2e; --bad:#ff8a7a; --bad-soft:#3f201b; --pay:#f0b755; --pay-soft:#3a2e15;
  --good:#4cc38a; --shadow:0 0 0 1px #262f2b;
  --big:#a79ef0; --big-soft:#26223f; --inc:#4cd695; --inc-soft:#173a2a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767; --s0:#74807a;
}
/* Slate: a quieter, flatter look */
[data-style="slate"]{
  --bg:#f5f6f8; --card:#ffffff; --ink:#111827; --mute:#5d6778; --line:#e2e6ed;
  --acc:#24408f; --acc-soft:#e8ecf8; --bad:#b42318; --bad-soft:#fdecea; --pay:#8f6200; --pay-soft:#fbf2dc;
  --good:#11795a; --shadow:none; --big:#5b45c9; --big-soft:#efecfb; --inc:#11795a; --inc-soft:#e2f3ec;
  --on-acc:#ffffff;
}
[data-style="slate"][data-theme="dark"]{
  --bg:#0d1016; --card:#151a22; --ink:#e7ecf3; --mute:#8d98aa; --line:#252c38;
  --acc:#8fb0ff; --acc-soft:#1a2540; --bad:#f3897a; --bad-soft:#3a1f1c; --pay:#dcae57; --pay-soft:#33290f;
  --good:#45c296; --shadow:none; --big:#a99cf5; --big-soft:#211d3a; --inc:#45c296; --inc-soft:#12332a;
  --on-acc:#0d1016;
}
/* AMOLED: true black, as little as possible */
[data-style="amoled"]{
  --bg:#000000; --card:#000000; --ink:#ededed; --mute:#8a8a8a; --line:#1c1c1c;
  --acc:#ffffff; --acc-soft:#161616; --bad:#ff6b5e; --bad-soft:#1a0c0a; --pay:#d8b15a; --pay-soft:#15110a;
  --good:#7fdca6; --shadow:none; --big:#ffffff; --big-soft:#0d0d0d; --inc:#7fdca6; --inc-soft:#000000;
  --on-acc:#000000;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767; --s0:#5c5c5c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:700}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.monthnav button{width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--mute)}
.monthnav button:disabled{opacity:.25}
.monthnav span{min-width:86px;text-align:center;font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.bad{color:var(--bad)} .good{color:var(--good)} .pay{color:var(--pay)}
.meter{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 6px;position:relative}
.meter i{display:block;height:100%;background:var(--acc);border-radius:999px}
.meter.over i{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.kv+.kv{border-top:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.acct{flex:1 1 30%;min-width:96px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.acct b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct span{font-size:13px;color:var(--acc);font-variant-numeric:tabular-nums}
.entry{display:flex;gap:10px;align-items:center;padding:10px 0;width:100%;text-align:left}
.entry+.entry,.daygrp .entry{border-top:1px solid var(--line)}
.dot{--c:var(--s0);width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.dot svg{width:21px;height:21px}
.dot.sm{width:30px;height:30px;border-radius:10px}.dot.sm svg{width:17px;height:17px}
.dot.inc{background:var(--inc-soft);color:var(--inc)} .dot.tr{background:var(--line);color:var(--mute)}
.entry.inc .a{color:var(--inc)} .entry.tr .a{color:var(--mute)}
.entry.lg{background:var(--big-soft);box-shadow:inset 3px 0 0 var(--big);border-radius:10px;margin:3px -8px;padding:10px 8px;width:calc(100% + 16px);border-top-color:transparent!important}
.entry.lg+.entry{border-top-color:transparent}
.entry.lg .a{font-weight:800}
.tag.b{background:var(--big);color:var(--card)}
.kv.tap{width:100%;text-align:left;align-items:center}
.kv.tap>span:first-child::after{content:" ›";color:var(--mute)}
button.card{display:block;width:calc(100%);text-align:left}
.donutwrap{display:flex;justify-content:center;margin:6px 0 10px}
.donut{width:190px;height:190px}
.donut{cursor:pointer}.donut circle.seg{fill:none;stroke-width:26}
.donut text{fill:var(--ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.catrow .row{gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.icons button{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute)}
.icons button svg{width:20px;height:20px}
.icons button.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.entry .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .a{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--pay-soft);color:var(--pay);vertical-align:1px;margin-left:4px}
.tag.s{background:var(--acc-soft);color:var(--acc)}
.dayhdr{font-size:12px;color:var(--mute);font-weight:600;padding:12px 0 4px;display:flex;justify-content:space-between}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center}
nav.tabs button{flex:1;padding:6px 0;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc);font-weight:700}
nav.tabs .add{flex:none;width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;font-size:30px;line-height:1;margin:-18px 8px 0;box-shadow:0 6px 16px rgba(22,101,72,.35);display:grid;place-items:center}
[data-theme="dark"] nav.tabs .add{color:#0f1412}
.sheetwrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94dvh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet .hd{display:flex;align-items:center;margin-bottom:10px}
.sheet .hd h3{flex:1;margin:0;font-size:17px}
.x{width:36px;height:36px;border-radius:50%;background:var(--card);font-size:18px;color:var(--mute)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
[data-theme="dark"] .seg button.on{color:#0f1412}
.amt{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 14px;margin:10px 0;border:1px solid var(--line)}
.amt span{color:var(--mute);font-weight:600}
.amt input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:28px;font-weight:750;font-variant-numeric:tabular-nums}
.ops{display:flex;gap:6px}
.ops button{width:34px;height:34px;border-radius:10px;background:var(--bg);font-size:17px;color:var(--mute)}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:12px 2px 6px}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.pick button{display:inline-flex;align-items:center;gap:6px}.pick .ci{display:inline-grid}.pick .ci svg{width:17px;height:17px}
.pick button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.field{display:flex;gap:8px;margin-top:10px}
.field input,.field select,.inp{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:0;width:100%}
.inp:focus,.field input:focus{border-color:var(--acc)}
.sw{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;width:100%;text-align:left}
.sw .grow b{display:block;font-size:14px} .sw .grow span{font-size:12.5px;color:var(--mute)}
.tog{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on .tog{background:var(--acc)} .sw.on .tog::after{left:21px}
.sw.on.payout .tog{background:var(--pay)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;margin-top:14px;text-align:center}
[data-theme="dark"] .btn{color:#0f1412}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;margin:0;font-size:14px;border-radius:10px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:flex;margin-top:5px}
.bar{--c:var(--acc)}.bar i{display:block;height:100%;background:var(--c)} .bar i.p{opacity:.4;margin-left:2px}
.catrow{display:block;width:100%;text-align:left;padding:9px 0}
.catrow+.catrow{border-top:1px solid var(--line)}
.note{background:var(--acc-soft);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
.note.w{background:var(--bad-soft)} .note.p{background:var(--pay-soft)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--mute);margin-right:5px}
.legend i.p{opacity:.4}
.delta{font-size:12px;color:var(--mute)}
.mrow{padding:8px 0}.mrow+.mrow{border-top:1px solid var(--line)}
.mbar{height:10px;border-radius:999px;background:var(--line);position:relative;margin-top:5px}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--acc)}
.mbar i.o{background:var(--bad)}
.mbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11.5px;color:var(--mute);text-align:right;font-weight:600;padding:4px 0}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90%;text-align:center}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#lock .pins{display:flex;gap:12px} #lock .pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)} #lock .pins i.f{background:var(--acc)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
#lock .pad button{height:60px;border-radius:18px;background:var(--card);font-size:22px;font-weight:600}
.list button.li{display:flex;width:100%;align-items:center;gap:10px;padding:12px 0;text-align:left}
.list button.li+button.li{border-top:1px solid var(--line)}
.list .li .grow b{display:block}.list .li .grow span{font-size:12.5px;color:var(--mute)}
.chev{color:var(--mute)}
.filters{display:flex;gap:8px;margin:4px 0 2px}
.filters select{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}

.calcbtn{flex:none;height:36px;padding:0 10px;border-radius:10px;background:var(--bg);color:var(--mute);font-size:14px;font-weight:700;letter-spacing:.05em}.calcbtn.on{color:var(--acc)}
.amt+.ops{justify-content:flex-end;margin:-4px 0 4px}
.hscroll{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;margin:2px -14px 4px;padding:0 14px 2px}.hscroll::-webkit-scrollbar{display:none}.hscroll button{flex:none}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 7px;border-radius:12px;border:1px solid transparent;font-size:11.5px;line-height:1.2;text-align:center}
.ctile .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mute)}
.ctile.on{background:var(--acc-soft);border-color:var(--acc)}.ctile.on .nm{color:var(--ink);font-weight:700}
.inl{display:flex;align-items:center;gap:10px;margin-top:12px}.inl .lbl{margin:0;flex:none;width:56px}.inl .pick{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}.inl .pick::-webkit-scrollbar{display:none}.inl .pick button{flex:none}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.opt{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mute)}
.opt.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.opt.payout.on{background:var(--pay-soft);border-color:var(--pay);color:var(--pay)}
.optnote{font-size:12.5px;color:var(--mute);margin:6px 2px 0;min-height:0}
.savebar{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:10px 0 calc(16px + env(safe-area-inset-bottom));margin:12px 0 calc(-16px - env(safe-area-inset-bottom));z-index:2}
.savebar .btn{margin-top:0}
[data-style="amoled"] .opt,[data-style="amoled"] .calcbtn{background:#000;border:1px solid #2a2a2a}
[data-style="amoled"] .opt.on{background:#fff;color:#000;border-color:#fff}
[data-style="amoled"] .ctile.on{background:#111;border-color:#fff}
.toast button{margin-left:12px;font-weight:800;text-decoration:underline;color:inherit}
.pick.fav button{font-weight:600}
.payblk+.payblk{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.duerow{padding:8px 0;gap:8px}.duerow+.duerow{border-top:1px solid var(--line)}
.filters.rng{align-items:flex-end}.filters.rng label{flex:1;min-width:0;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.filters.rng input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 8px;width:100%;min-width:0}
.autobk{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0 2px}.autobk .btn{margin-top:10px}
#lock .fp{padding:10px 18px;border-radius:999px;background:var(--card);font-weight:600}
select.inp{appearance:auto}
.rseg{margin:2px 0 4px}.rseg button{font-size:13px;padding:8px 2px}
.stat3{display:flex;gap:8px;margin-top:12px}.stat3 div{flex:1;background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}.stat3 b{display:block;font-size:20px}.stat3 span{font-size:12px;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.ch{text-align:center;font-size:11px;color:var(--mute)}
.cd{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums;background:transparent;border:1px solid var(--line);color:var(--mute)}
.cd.x{border:0}
.cd.l1{background:color-mix(in srgb,var(--acc) 20%,transparent);border-color:transparent;color:var(--ink)}
.cd.l2{background:color-mix(in srgb,var(--acc) 45%,transparent);border-color:transparent;color:var(--ink)}
.cd.l3{background:color-mix(in srgb,var(--acc) 72%,transparent);border-color:transparent;color:var(--bg)}
.cd.l4{background:var(--acc);border-color:transparent;color:var(--bg);font-weight:700}
.cd.fut{opacity:.35}.cd.now{outline:2px solid var(--ink);outline-offset:1px}
.callegend{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:11px;color:var(--mute);margin-top:8px}
.callegend .cd{width:14px;height:14px;aspect-ratio:auto;border-radius:4px;display:inline-block}
.wk{display:flex;align-items:flex-end;gap:8px;height:116px;margin:4px 0 10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wk i{display:block;width:100%;max-width:28px;border-radius:4px 4px 0 0;background:var(--acc)}.wk i.we{opacity:.5}
.wv,.wl{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;min-height:14px}
.line{display:block;width:100%;height:auto;margin:8px 0 2px}.line .ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line .ln2{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.55}
.line .ax{stroke:var(--line)}.line .pt{fill:var(--acc);stroke:var(--card);stroke-width:2}.line .lt{font-size:10px;fill:var(--mute)}
.spark{width:84px;height:28px;flex:none}.spark path{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.spark circle{fill:var(--c)}
.trow{padding:7px 0}.trow+.trow{border-top:1px solid var(--line)}
.cmpart{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}

/* ---- motion: only in answer to something you did ---- */
button{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,color .15s ease}
.btn:active,.pick button:active,.acct:active,.x:active,nav.tabs .add:active,.seg button:active{transform:scale(.97)}
.entry:active,.catrow:active,.kv.tap:active,.li:active{opacity:.6}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes slideL{from{opacity:0;transform:translateX(18px)}}
@keyframes slideR{from{opacity:0;transform:translateX(-18px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes dimIn{from{background:rgba(0,0,0,0)}}
@keyframes dimOut{to{background:rgba(0,0,0,0)}}
@keyframes ring{from{transform:rotate(-70deg) scale(.9);opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
#app.a-tab>*:not(header){animation:fadeUp .22s cubic-bezier(.2,.7,.2,1) both}
#app.a-next>*:not(header){animation:slideL .24s cubic-bezier(.2,.7,.2,1) both}
#app.a-prev>*:not(header){animation:slideR .24s cubic-bezier(.2,.7,.2,1) both}
#app[class^="a-"] .meter i,#app[class^="a-"] .bar i,#app[class^="a-"] .mbar i{transform-origin:left;animation:grow .6s cubic-bezier(.2,.7,.2,1) .08s both}
#app[class^="a-"] .wk i{transform-origin:bottom;animation:growY .5s cubic-bezier(.2,.7,.2,1) .05s both}
#app[class^="a-"] .donut{transform-origin:50% 50%;animation:ring .6s cubic-bezier(.2,.7,.2,1) both}
.sheetwrap{animation:dimIn .22s ease both}
.sheetwrap .sheet{animation:sheetIn .28s cubic-bezier(.2,.8,.2,1) both}
.sheetwrap.out{animation:dimOut .18s ease both;pointer-events:none}
.sheetwrap.out .sheet{animation:sheetOut .18s ease-in both}
.toast{animation:toastIn .2s ease both}
.meter i,.tog,.tog::after{transition:all .2s ease}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" hidden>
<script src="xlsx.full.min.js"></script>
<script>
"use strict";
/* ---------- storage ---------- */
const LS='paisa.v2';
const DEF_EXP=['Food & Drink','Bills & Utilities','Fuel','Maintenance','Personal','Family','Shopping','Grocery','Office','Gifts','Committee','CC Bill','Loan Paid','Medical','Transport','Other Expenses'];
const DEF_INC=['Salary','Other Income'];
let uidc=0; const uid=()=>Date.now().toString(36)+(uidc++).toString(36)+Math.random().toString(36).slice(2,5);
function fresh(){return {v:2,accounts:[],categories:[...DEF_EXP.map(n=>({id:uid(),name:n,type:'expense'})),...DEF_INC.map(n=>({id:uid(),name:n,type:'income'}))],entries:[],settings:{theme:'auto',pin:null,lastBackup:null,started:false},mem:{}};}
let S; try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){S=null}
if(!S||!S.entries) S=fresh();
S.mem=S.mem||{}; S.settings=S.settings||{theme:'auto'};
let saveFailed=false;
function save(){snapDaily();try{localStorage.setItem(LS,JSON.stringify(S));saveFailed=false}catch(e){saveFailed=true;toast('Could not save on this device. Make a backup now.')}afterSave()}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'Rs '+Math.round(n).toLocaleString('en-US');
const fnum=n=>Math.round(n).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const nice=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+', '+DOW[d.getDay()]};
const acc=id=>S.accounts.find(a=>a.id===id);
const cat=id=>S.categories.find(c=>c.id===id);
const accName=id=>(acc(id)||{name:'(removed)'}).name;
const catName=id=>(cat(id)||{name:'No category'}).name;
const payOf=e=>e.type==='expense'&&e.payout?(e.payAmt!=null?Math.min(e.payAmt,e.amount):e.amount):0;
function xp(list){const out=[];for(const e of list){if(e.type==='expense'&&e.payout&&e.payAmt!=null&&e.payAmt<e.amount){const a={...e,amount:e.payAmt};delete a.payAmt;const b={...e,amount:e.amount-e.payAmt};delete b.payAmt;delete b.payout;out.push(a,b)}else out.push(e)}return out}
const isSalary=e=>e.type==='income'&&(e.startsMonth||/^salary$/i.test(catName(e.cat)));
let toastFn=null;
function toast(m,act){const t=$('#toast');t.innerHTML='<div class="toast">'+esc(m)+(act?'<button data-act="toastact">'+esc(act.label)+'</button>':'')+'</div>';toastFn=act?act.fn:null;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.innerHTML='';toastFn=null},act?6000:2600)}

/* ---------- category icons and colours ---------- */
const CI={
 food:'<path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2.5 5-2.5 8H17v10"/>',
 bill:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',
 fuel:'<path d="M5 21V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16M4 21h11M7 7h5v4H7zM14 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
 person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 family:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17 14.6a5.5 5.5 0 0 1 5 6.4"/>',
 bag:'<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/>',
 cart:'<path d="M3 4h2l2.5 11h10L20 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
 work:'<path d="M3 8h18v12H3zM9 8V5h6v3M3 13h18"/>',
 gift:'<path d="M4 11h16v10H4zM3 7h18v4H3zM12 7v14M12 7c-1.5-4-6-3.5-5-1 .6 1.5 3 1 5 1zM12 7c1.5-4 6-3.5 5-1-.6 1.5-3 1-5 1z"/>',
 cycle:'<path d="M4 12a8 8 0 0 1 14-5.3L20 5v5h-5M20 12a8 8 0 0 1-14 5.3L4 19v-5h5"/>',
 card:'<path d="M2 6h20v12H2zM2 10h20M6 15h4"/>',
 loan:'<circle cx="12" cy="12" r="9"/><path d="M12 16V8M9 11l3-3 3 3"/>',
 medical:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
 bus:'<path d="M5 16V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10zM5 11h14M8 16v3M16 16v3"/>',
 dots:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
 wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14h.01"/>',
 plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
 swap:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
 home:'<path d="M3 11l9-8 9 8v10H3zM10 21v-6h4v6"/>',
 phone:'<path d="M8 2h8a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM11 18h2"/>',
 play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>',
 plane:'<path d="M3 13l18-8-6 16-3-7z"/>',
 book:'<path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-5a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h5z"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/>',
 tool:'<path d="M14.5 5.5a4 4 0 0 0-5.2 5.2L3 17v4h4l6.3-6.3a4 4 0 0 0 5.2-5.2l-2.6 2.6-2.3-.6-.6-2.3z"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="8" cy="9" r="1.2"/>'
};
const CMAP=[[/cc bill|credit|card/,'card',7],[/bill|utilit|subscription/,'bill',1],[/food|drink|restaurant|dining|eat/,'food',2],[/mainten|service|repair/,'tool',6],[/fuel|petrol|car|bike/,'fuel',8],[/personal/,'person',7],[/family/,'family',5],[/shop|cloth/,'bag',4],[/grocer/,'cart',3],[/office|work|business|freelance/,'work',1],[/gift|salami/,'gift',5],[/committee/,'cycle',6],[/loan|install|debt/,'loan',3],[/medic|health|doctor/,'medical',8],[/transport|ride|taxi/,'bus',2],[/salary|pay/,'wallet',6],[/income|bonus|received/,'plus',3],[/home|rent/,'home',4],[/mobile|phone/,'phone',1],[/entertain|movie|game/,'play',7],[/travel|trip/,'plane',2],[/educat|school|course/,'book',1],[/donat|charity|wedding/,'heart',5],[/other/,'dots',8]];
function catLook(c){if(!c)return {icon:'tag',col:0};let icon=c.icon,col=c.col;if(!icon||!col){const n=c.name.toLowerCase();const m=CMAP.find(x=>x[0].test(n));if(!icon)icon=m?m[1]:'tag';if(!col)col=m?m[2]:(S.categories.indexOf(c)%8)+1}return {icon,col}}
const gsvg=(k,w)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.8)+'" stroke-linecap="round" stroke-linejoin="round">'+(CI[k]||CI.tag)+'</svg>';
function catDot(id,sm){const l=catLook(cat(id));return `<span class="dot ${sm?'sm':''}" style="--c:var(--s${l.col})">${gsvg(l.icon)}</span>`}
const bigAt=()=>+S.settings.bigAt>0?+S.settings.bigAt:50000;

/* ---------- months that start on payday ---------- */
function labelFor(s){const d=pd(s);let y=d.getFullYear(),m=d.getMonth();if(d.getDate()>=15){m++;if(m>11){m=0;y++}}return {key:y+'-'+pad(m+1),label:MON[m]+' '+y}}
function calLabel(y,m){return {key:y+'-'+pad(m+1),label:MON[m]+' '+y}}
function cycles(){
  const starts=[...new Set(S.entries.filter(e=>e.type==='income'&&e.startsMonth).map(e=>e.date))].sort();
  const bs=[];
  for(const d of starts){const l=labelFor(d);if(!bs.length||l.key>bs[bs.length-1].key)bs.push({start:d,key:l.key,label:l.label})}
  const dates=S.entries.map(e=>e.date).sort();
  const first=dates[0]||today();
  const out=[];
  const calUntil=(from,stop)=>{ // calendar months from `from` up to (not including) `stop` (or through today if stop null)
    let d=pd(from);d=new Date(d.getFullYear(),d.getMonth(),1);
    const lim=stop||addDays(today(),1);
    while(iso(d)<lim){const nx=new Date(d.getFullYear(),d.getMonth()+1,1);const l=calLabel(d.getFullYear(),d.getMonth());
      out.push({start:iso(d),end:(stop&&iso(nx)>stop)?stop:iso(nx),key:l.key,label:l.label,cal:true});d=nx}
  };
  if(!bs.length){calUntil(first<today()?first:today(),null);const last=out[out.length-1];if(last)last.end=null;return fix(out)}
  if(first<bs[0].start)calUntil(first,bs[0].start);
  if(out.length&&out[out.length-1].key>=bs[0].key){const p=out.pop();bs[0]={...bs[0],start:p.start}}
  bs.forEach((b,i)=>out.push({start:b.start,end:bs[i+1]?bs[i+1].start:null,key:b.key,label:b.label}));
  return fix(out);
  function fix(a){if(!a.length){const t=new Date();const l=calLabel(t.getFullYear(),t.getMonth());a.push({start:iso(new Date(t.getFullYear(),t.getMonth(),1)),end:null,key:l.key,label:l.label,cal:true})}return a}
}
const inCyc=(c,d)=>d>=c.start&&(!c.end||d<c.end);
function cycStats(c){
  const es=S.entries.filter(e=>inCyc(c,e.date));
  const r={es,salary:0,extra:0,spent:0,payout:0,exp:[]};
  for(const e of es){
    if(e.type==='income'){if(isSalary(e))r.salary+=e.amount;else r.extra+=e.amount}
    else if(e.type==='expense'){for(const x of xp([e])){r.exp.push(x);if(x.payout)r.payout+=x.amount;else r.spent+=x.amount}}
  }
  r.left=r.salary-r.spent; r.total=r.spent+r.payout;
  return r;
}
function balances(){const b={};S.accounts.forEach(a=>b[a.id]=+a.opening||0);
  for(const e of S.entries){if(e.type==='income')b[e.acc]=(b[e.acc]||0)+e.amount;else if(e.type==='expense')b[e.acc]=(b[e.acc]||0)-e.amount;else{b[e.acc]=(b[e.acc]||0)-e.amount;b[e.toAcc]=(b[e.toAcc]||0)+e.amount}}
  return b}

/* ---------- view state ---------- */
let V={tab:'home',key:null,q:'',fAcc:'',fCat:'',sheet:null};
function curCycles(){const cs=cycles();let i=cs.findIndex(c=>c.key===V.key);if(i<0){i=cs.findIndex(c=>inCyc(c,today()));if(i<0)i=cs.length-1;V.key=cs[i].key}return {cs,i,c:cs[i]}}
const ICON={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',list:'<path d="M4 6h16M4 12h16M4 18h10"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.2-1.3L14 3h-4l-.4 2.5a7 7 0 0 0-2.2 1.3l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .9.1 1.3l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.2 1.3L10 21h4l.4-2.5a7 7 0 0 0 2.2-1.3l2.3 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/>'};
const svg=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICON[n]+'</svg>';
function renderTabs(){const t=(id,ic,l)=>`<button data-act="tab" data-id="${id}" class="${V.tab===id?'on':''}">${svg(ic)}${l}</button>`;
  $('#tabs').innerHTML=t('home','home','Home')+t('entries','list','Entries')+'<button class="add" data-act="add" aria-label="Add entry">+</button>'+t('reports','chart','Reports')+t('settings','gear','Settings')}
function monthNav(){const {cs,i,c}=curCycles();return `<div class="monthnav"><button data-act="cyc" data-d="-1" ${i<=0?'disabled':''} aria-label="Previous month">‹</button><span>${esc(c.label)}</span><button data-act="cyc" data-d="1" ${i>=cs.length-1?'disabled':''} aria-label="Next month">›</button></div>`}
function head(title,nav=true){return `<header class="top"><h1>${title}</h1>${nav?monthNav():''}</header>`}

/* ---------- entry row ---------- */
function entryRow(e,showDate){
  let t,s,a,cls='',dot;const rf=e.type==='expense'&&e.amount<0;
  if(e.type==='transfer'){t='Transfer';s=accName(e.acc)+' → '+accName(e.toAcc);a=fmt(e.amount);cls='tr';dot='<span class="dot tr">'+gsvg('swap')+'</span>'}
  else{t=catName(e.cat);s=accName(e.acc);a=(e.type==='expense'&&!rf?'−':'+')+fmt(Math.abs(e.amount));if(e.type==='income'){cls='inc';dot='<span class="dot inc">'+gsvg(catLook(cat(e.cat)).icon)+'</span>'}else{dot=catDot(e.cat);if(rf)cls='inc'}}
  const big=e.amount>=bigAt()&&e.type!=='transfer';
  const tags=(e.payout?'<span class="tag">'+(e.payAmt!=null&&e.payAmt<e.amount?'payout '+fnum(e.payAmt):'payout')+'</span>':'')+(e.type==='income'&&e.startsMonth?'<span class="tag s">starts month</span>':'')+(rf?'<span class="tag s">refund</span>':'')+(big?'<span class="tag b">large</span>':'');
  const sub=[s,e.note,e.odo?fnum(e.odo)+' km':'',showDate?nice(e.date):''].filter(Boolean).map(esc).join(' · ');
  return `<button class="entry ${cls} ${big?'lg':''}" data-act="edit" data-id="${e.id}">${dot}<span class="grow" style="flex:1;min-width:0"><div class="t">${esc(t)}${tags}</div><div class="s">${sub}</div></span><span class="a">${a}</span></button>`}
const sortE=es=>es.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));

/* ---------- HOME ---------- */
function expectedEnd(c){if(c.end)return c.end;const d=pd(c.start);if(c.cal)return iso(new Date(d.getFullYear(),d.getMonth()+1,1));return iso(new Date(d.getFullYear(),d.getMonth()+1,d.getDate()))}
function meterCard(c,st,isCur){
  if(!st.salary){return `<div class="card"><h2>Spent this month</h2><div class="big num">${fmt(st.spent)}</div><div class="sub">No salary logged for ${esc(c.label)} yet. Add it as Income with “starts new month” on, and the meter appears.</div>${st.payout?`<div class="kv" style="margin-top:8px"><span class="pay">Paid from payout</span><b class="num">${fmt(st.payout)}</b></div>`:''}</div>`}
  const pct=Math.min(100,st.spent/st.salary*100),over=st.left<0;
  let line;
  if(over)line=`<b class="bad">You’ve spent ${fmt(-st.left)} more than your salary.</b>`;
  else if(isCur){const dl=Math.max(1,daysBetween(today(),expectedEnd(c)));line=`${fmt(st.left)} left · about <b>${fmt(st.left/dl)}</b> a day for ${dl} day${dl>1?'s':''}`}
  else line=`Finished ${fmt(st.left)} under salary`;
  return `<button class="card" data-act="rlist" data-k="spent"><h2>Spent from salary ›</h2><div class="row"><div class="big num grow ${over?'bad':''}">${fmt(st.spent)}</div><div class="sub num">of ${fmt(st.salary)}</div></div><div class="meter ${over?'over':''}"><i style="width:${pct}%"></i></div><div class="sub">${line}</div>${st.payout?`<div class="kv" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><span class="pay">Paid from payout (not counted)</span><b class="num">${fmt(st.payout)}</b></div>`:''}</button>`}
function backupNudge(){if(autoInfo().folder||S.entries.length<10)return '';const lb=S.settings.lastBackup;if(lb&&daysBetween(lb,today())<14)return '';
  return has('pickBackupFolder')?`<div class="note p">Your entries exist only on this phone. Choose a folder and Paisa will back up there by itself.<button class="btn sm" data-act="bkfolder" style="display:block;margin-top:8px">Choose backup folder</button></div>`:`<div class="note p">${lb?'Your last backup was '+daysBetween(lb,today())+' days ago.':'You have not saved a backup yet.'} Your entries exist only on this device.<button class="btn sm" data-act="backup" style="display:block;margin-top:8px">Save a backup</button></div>`}
function renderHome(){
  const {cs,i,c}=curCycles(),st=cycStats(c),isCur=inCyc(c,today()),b=balances();

  if(isCur&&!c.cal&&daysBetween(c.start,today())>35)h+=`<div class="note p">This month has run ${daysBetween(c.start,today())} days. Log your salary with “starts new month” on to begin the next one.</div>`;

  h+=dueCard();
  h+=homeCard();

  const rec=sortE(st.es).slice(0,6);
  h+=`<div class="card"><h2>Recent</h2>${rec.map(e=>entryRow(e,true)).join('')||'<div class="empty">Nothing logged in '+esc(c.label)+' yet.<br>Tap + to add an entry.</div>'}${st.es.length>6?'<button class="btn ghost" data-act="tab" data-id="entries">See all '+st.es.length+'</button>':''}</div>`;
  return h}

/* ---------- ENTRIES ---------- */
function renderEntries(){
  const {c}=curCycles();const q=V.q.trim().toLowerCase();
  const rng=!!(V.from||V.to);let es=q?S.entries:rng?S.entries.filter(e=>(!V.from||e.date>=V.from)&&(!V.to||e.date<=V.to)):S.entries.filter(e=>inCyc(c,e.date));
  if(q)es=es.filter(e=>(e.note||'').toLowerCase().includes(q)||catName(e.cat).toLowerCase().includes(q)||accName(e.acc).toLowerCase().includes(q)||String(e.amount).includes(q));
  if(V.fAcc)es=es.filter(e=>e.acc===V.fAcc||e.toAcc===V.fAcc);

  if(!es.length)return h+'<div class="empty">No entries match.</div>';

  for(const e of es){if(e.date!==last){const day=es.filter(x=>x.date===e.date&&x.type==='expense').reduce((s,x)=>s+x.amount,0);h+=`<div class="dayhdr"><span>${nice(e.date)}${q||rng?' '+pd(e.date).getFullYear():''}</span><span class="num">${day?'−'+fmt(day):''}</span></div><div class="daygrp">`;last=e.date}
    h+=entryRow(e,false);const nx=es[es.indexOf(e)+1];if(!nx||nx.date!==e.date)h+='</div>'}

/* ---------- REPORTS ---------- */
const normNote=n=>(n||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function catTotals(st){const m={};for(const e of st.exp){const k=e.cat||'';m[k]=m[k]||{s:0,p:0,n:0};if(e.payout)m[k].p+=e.amount;else m[k].s+=e.amount;m[k].n++}return m}
function rMonth(){
  const {cs,i,c}=curCycles(),st=cycStats(c),isCur=inCyc(c,today());
  let h='';
  if(!st.es.length)return h+'<div class="empty">Nothing logged in '+esc(c.label)+' yet.</div>';
  const prior=cs.slice(Math.max(0,i-6),i).map(x=>({c:x,st:cycStats(x)})).filter(x=>x.st.es.length);
  const prev=prior.length?prior[prior.length-1]:null;
  const ct=catTotals(st);const rows=Object.entries(ct).map(([k,v])=>({k,...v,t:v.s+v.p})).filter(r=>r.t>0).sort((a,b)=>b.t-a.t);
  const avg={};if(prior.length){for(const p of prior){const m=catTotals(p.st);for(const k in m)avg[k]=(avg[k]||0)+m[k].s+m[k].p}for(const k in avg)avg[k]/=prior.length}
  const prevCt=prev?catTotals(prev.st):null;
  // projection
  let proj=null;const elapsed=Math.max(1,daysBetween(c.start,isCur?today():(c.end||today()))+(isCur?1:0));const len=Math.max(elapsed,daysBetween(c.start,expectedEnd(c)));
  if(isCur&&st.salary&&elapsed>=7){const big=Math.max(10000,st.salary*0.1);let one=0,every=0;for(const e of st.exp){if(e.payout)continue;if(e.amount>=big||/committee|loan|cc bill|rent|install/i.test(catName(e.cat)))one+=e.amount;else every+=e.amount}proj=one+every/elapsed*len}
  // groups by note
  const g={};for(const e of st.exp){const k=normNote(e.note);if(!k)continue;g[k]=g[k]||{n:0,s:0,label:e.note.trim()};g[k].n++;g[k].s+=e.amount}
  const reps=Object.values(g).filter(x=>x.n>=2).sort((a,b)=>b.s-a.s);
  // stands out
  const notes=[];
  if(st.salary){if(st.left<0)notes.push(['w',`You’ve spent <b>${fmt(-st.left)}</b> more than your salary this month.`]);
    else if(proj!=null)notes.push([proj>st.salary?'w':'',proj>st.salary?`At this pace you’ll finish about <b>${fmt(proj-st.salary)}</b> over your salary.`:`At this pace you’ll finish about <b>${fmt(st.salary-proj)}</b> under your salary.`])}
  if(prior.length){let best=null;for(const r of rows){const a=avg[r.k]||0;if(a>0&&r.t-a>2000&&r.t>a*1.25&&(!best||r.t-a>best.d))best={d:r.t-a,r,a}}if(best)notes.push(['',`<b>${esc(catName(best.r.k))}</b> is ${Math.round((best.r.t/best.a-1)*100)}% above your usual (${fmt(best.r.t)} against ${fmt(best.a)}).`])}
  if(reps.length)notes.push(['',`Small repeats add up: <b>${esc(reps[0].label)}</b> ${reps[0].n} times came to ${fmt(reps[0].s)}.`]);
  const bigE=st.exp.slice().sort((a,b)=>b.amount-a.amount)[0];
  if(bigE&&st.total&&bigE.amount/st.total>=0.25)notes.push(['p',`<b>${esc(bigE.note||catName(bigE.cat))}</b> alone is ${Math.round(bigE.amount/st.total*100)}% of everything spent this month${bigE.payout?' (paid from payout)':''}.`]);
  h+=`<div class="card"><h2>What stands out</h2>${notes.slice(0,3).map(n=>`<div class="note ${n[0]}">${n[1]}</div>`).join('')||'<div class="sub">Nothing unusual so far.</div>'}</div>`;
  // salary
  h+=`<div class="card"><h2>Am I within my salary?</h2>${st.salary?`<button class="kv tap" data-act="rlist" data-k="salary"><span>Salary</span><b class="num">${fmt(st.salary)}</b></button><button class="kv tap" data-act="rlist" data-k="spent"><span>Spent from salary</span><b class="num">${fmt(st.spent)}</b></button><div class="kv"><span>${st.left<0?'Over by':'Left'}</span><b class="num ${st.left<0?'bad':'good'}">${fmt(Math.abs(st.left))}</b></div>${proj!=null?`<div class="kv"><span>Estimated at month end</span><b class="num ${proj>st.salary?'bad':''}">${fmt(proj)}</b></div>`:(isCur?'<div class="sub" style="padding-top:6px">A month-end estimate appears after a week of entries.</div>':'')}`:`<div class="sub">No salary logged for this month.</div><button class="kv tap" data-act="rlist" data-k="spent"><span>Spent so far</span><b class="num">${fmt(st.spent)}</b></button>`}</div>`;
  h+=sameDayCard(cs,i,c,st,isCur);
  h+=fixedFlexCard(st);
  // payout pot (all time)
  let potIn=0,potOut=0;for(const e of S.entries){if(e.type==='income'&&!isSalary(e))potIn+=e.amount;if(e.type==='expense'&&e.payout)potOut+=payOf(e)}
  if(potIn||potOut)h+=`<div class="card"><h2>Payout and other income</h2><button class="kv tap" data-act="rlist" data-k="potin"><span>Received so far</span><b class="num">${fmt(potIn)}</b></button><button class="kv tap" data-act="rlist" data-k="potout"><span>Spent from it</span><b class="num pay">${fmt(potOut)}</b></button><div class="kv"><span>${potIn-potOut<0?'Overspent by':'Remaining'}</span><b class="num ${potIn-potOut<0?'bad':''}">${fmt(Math.abs(potIn-potOut))}</b></div><div class="sub" style="padding-top:6px">All months together. This month: received ${fmt(st.extra)}, spent ${fmt(st.payout)}.</div></div>`;
  // categories: donut + list
  const top=rows.slice(0,6),rest=rows.slice(6);const segs=top.map(r=>({k:r.k,v:r.t,col:catLook(cat(r.k)).col}));if(rest.length)segs.push({k:'__other',v:rest.reduce((a,r)=>a+r.t,0),col:0});
  // keep look-alike colours from sitting next to each other on the ring
  const clash=(x,y)=>x&&y&&(x.col===y.col||[[5,8],[2,4],[1,7],[3,6]].some(p=>p.includes(x.col)&&p.includes(y.col)));
  for(let j=0;j<segs.length-2;j++)if(clash(segs[j],segs[j+1])&&!clash(segs[j],segs[j+2])){const t=segs[j+1];segs[j+1]=segs[j+2];segs[j+2]=t}
  const R=70,C=2*Math.PI*R;let off=0;const gap=segs.length>1?2.5:0;
  const arcs=segs.map(g=>{const len=Math.max(0.5,g.v/st.total*C-gap);const o=`<circle class="seg" cx="100" cy="100" r="${R}" stroke="var(--s${g.col})" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(g.k==='__other'?'Other categories':catName(g.k))}: ${fmt(g.v)}</title></circle>`;off+=g.v/st.total*C;return o}).join('');
  DONUT=segs.map(g=>({k:g.k,f:g.v/st.total}));
  const max=rows.length?rows[0].t:1;
  h+=`<div class="card"><h2>Where did it go?</h2><div class="donutwrap"><svg class="donut" data-act="donut" viewBox="0 0 200 200" role="img" aria-label="Spending by category">${arcs}<text x="100" y="96" font-size="11" style="fill:var(--mute)">Spent in ${esc(c.label)}</text><text x="100" y="118" font-size="19" font-weight="750">${fmt(st.total)}</text></svg></div>${st.payout?'<div class="legend" style="justify-content:center"><span><i></i>From salary</span><span><i class="p"></i>From payout</span></div>':''}${rows.map(r=>{const l=catLook(cat(r.k));let d='';if(prevCt){const pv=prevCt[r.k]?prevCt[r.k].s+prevCt[r.k].p:0;const df=r.t-pv;d=`<div class="delta">${pv?(df>=0?'▲ ':'▼ ')+fmt(Math.abs(df))+' vs '+esc(prev.c.label):'new this month'}${avg[r.k]&&prior.length>1?' · usual '+fmt(avg[r.k]):''}</div>`}
    return `<button class="catrow" data-act="catview" data-id="${r.k}"><div class="row">${catDot(r.k,true)}<span class="grow" style="flex:1;min-width:0"><div class="row" style="gap:6px"><span class="grow" style="flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(catName(r.k))} <span class="sub">· ${r.n}</span></span><b class="num">${fmt(r.t)}</b><span class="sub num" style="width:34px;text-align:right">${Math.round(r.t/st.total*100)}%</span></div><div class="bar" style="--c:var(--s${l.col})"><i style="width:${r.s/max*100}%"></i>${r.p?`<i class="p" style="width:${r.p/max*100}%"></i>`:''}</div>${d}</span></div></button>`}).join('')}</div>`;
  // accounts
  const b=balances();
  h+=`<div class="card"><h2>How is each account doing?</h2><table class="t"><tr><th>Account</th><th>In</th><th>Spent</th><th>Now</th></tr>${S.accounts.filter(a=>!a.closed||st.es.some(e=>e.acc===a.id||e.toAcc===a.id)).map(a=>{let inn=0,sp=0;for(const e of st.es){if(e.type==='income'&&e.acc===a.id)inn+=e.amount;if(e.type==='transfer'&&e.toAcc===a.id)inn+=e.amount;if(e.type==='expense'&&e.acc===a.id)sp+=e.amount}return `<tr data-act="acctview" data-id="${a.id}"><td>${esc(a.name)} ›</td><td>${fnum(inn)}</td><td>${fnum(sp)}</td><td>${fnum(b[a.id]||0)}</td></tr>`}).join('')}</table><div class="sub" style="padding-top:6px">“In” counts income and transfers received this month.</div>${runwayLines(c,st,b)}</div>`;
  // biggest
  h+=`<div class="card"><h2>Biggest expenses</h2>${st.es.filter(e=>e.type==='expense').sort((a,b)=>b.amount-a.amount).slice(0,5).map(e=>entryRow(e,true)).join('')}</div>`;
  return h}

/* ---------- REPORTS: shared helpers ---------- */
const isFixed=c=>!!c&&(c.fixed!==undefined?!!c.fixed:/committee|bill|utilit|loan|rent|install|subscription|insurance|fee/i.test(c.name));
const isFlex=e=>e.type==='expense'&&!e.payout&&!isFixed(cat(e.cat));
const smallAt=()=>+S.settings.smallAt>0?+S.settings.smallAt:2000;
const fk=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?0:1)+'M':a>=1000?Math.round(n/1000)+'k':String(Math.round(n))};
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const shortDate=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
const keyLabel=k=>{const [y,m]=k.split('-').map(Number);return MON[m-1]+' '+y};
const keyDiff=(a,b)=>{const [ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (ya-yb)*12+(ma-mb)};
const keyAdd=(k,n)=>{let [y,m]=k.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)};
function cycDays(c){const end=c.end||addDays(today(),1);const out=[];for(let d=c.start;d<end&&d<=today();d=addDays(d,1))out.push(d);return out}
function elapsedOf(c){const isCur=inCyc(c,today());return Math.max(1,daysBetween(c.start,isCur?today():(c.end||today()))+(isCur?1:0))}
function noteGroups(es){const g={};for(const e of es){const k=normNote(e.note);if(!k)continue;g[k]=g[k]||{k,n:0,s:0,label:e.note.trim(),last:e};g[k].n++;g[k].s+=e.amount}return g}
const needMore=t=>`<div class="sub">${t}</div>`;
const stat3=a=>`<div class="stat3">${a.map(x=>`<div><b class="num">${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`;

function renderReports(){
  const tabs=[['month','This month'],['patterns','Patterns'],['long','Long view'],['tools','Tools']];
  const t=V.rtab||'month';
  let h=head('Reports',t!=='tools');
  h+=`<div class="seg rseg">${tabs.map(([k,l])=>`<button data-act="rtab" data-id="${k}" class="${t===k?'on':''}">${l}</button>`).join('')}</div>`;
  return h+({month:rMonth,patterns:rPatterns,long:rLong,tools:rTools})[t]()}

/* ---------- This month: extra cards ---------- */
function sameDayCard(cs,i,c,st,isCur){
  const prev=i>0?cs[i-1]:null;const pst=prev?cycStats(prev):null;
  if(!prev||!pst.es.length)return `<div class="card"><h2>Same point last month</h2>${needMore('This compares your spending so far with the same day of the previous month. It appears once you have a previous month.')}</div>`;
  const idx=elapsedOf(c)-1;const upto=addDays(prev.start,idx);
  const then=sum(pst.exp.filter(e=>!e.payout&&e.date<=upto),e=>e.amount);const now=st.spent;const mx=Math.max(now,then,1);const d=now-then;
  return `<div class="card"><h2>Same point last month</h2><div class="sub" style="margin-bottom:6px">${isCur?'Spending from salary by day '+(idx+1)+' of the month':'Spending from salary over the whole month'}</div>
  <div class="mrow"><div class="row"><b class="grow">${esc(c.label)}</b><span class="num">${fmt(now)}</span></div><div class="mbar"><i style="width:${now/mx*100}%"></i></div></div>
  <div class="mrow"><div class="row"><span class="grow">${esc(prev.label)}</span><span class="num">${fmt(then)}</span></div><div class="mbar"><i style="width:${then/mx*100}%;opacity:.45"></i></div></div>
  <div class="sub" style="padding-top:8px">${d===0?'Exactly level.':`You are <b class="${d>0?'bad':'good'}">${fmt(Math.abs(d))} ${d>0?'ahead of':'behind'}</b> last month’s spending at this point.`}</div></div>`}
function fixedFlexCard(st){
  const own=st.exp.filter(e=>!e.payout);const fx=sum(own.filter(e=>isFixed(cat(e.cat))),e=>e.amount),fl=sum(own.filter(e=>!isFixed(cat(e.cat))),e=>e.amount);
  const free=st.salary-fx;
  return `<div class="card"><h2>Fixed and flexible</h2>${st.salary?`<div class="kv"><span>Salary</span><b class="num">${fmt(st.salary)}</b></div>`:''}<button class="kv tap" data-act="rlist" data-k="fixed"><span>Fixed costs</span><b class="num">${fmt(fx)}</b></button>${st.salary?`<button class="kv tap" data-act="rlist" data-k="control"><span>Yours to control</span><b class="num">${fmt(free)}</b></button>`:''}<button class="kv tap" data-act="rlist" data-k="flex"><span>Flexible spending</span><b class="num">${fmt(fl)}</b></button>${st.salary?`<button class="kv tap" data-act="rlist" data-k="control"><span>${free-fl<0?'Over by':'Left of it'}</span><b class="num ${free-fl<0?'bad':'good'}">${fmt(Math.abs(free-fl))}</b></button><div class="meter ${fl>free?'over':''}"><i style="width:${free>0?Math.min(100,fl/free*100):100}%"></i></div>`:''}<div class="sub">Fixed costs are bills, committee and loans. Change which categories count as fixed in Settings, under each category. Payout spending is left out.</div></div>`}
function runwayLines(c,st,b){
  if(!inCyc(c,today()))return '';const el=elapsedOf(c);const out=[];

function cardOwedAt(d){if(!S.card)return 0;let last=null;for(const e of S.entries)if(isCardBill(e)&&e.date<=d&&(!last||e.date>last))last=e.date;return sum((S.cardTx||[]).filter(x=>x.date<=d&&(!last||x.date>last)),x=>x.amount)}
function committeeAt(key){let v=0;for(const m of cmAll()){if(!m.months||!m.start||!m.parts.length)continue;const paid=Math.max(0,Math.min(m.months,keyDiff(key,m.start)+1));v+=paid*sum(m.parts,p=>p.amt)-sum(m.parts.filter(p=>p.payoutMonth&&p.payoutMonth<=key),p=>cmPay(p,m))}return v} // positive: paid in more than received
function review(cs,i){const c=cs[i],st=cycStats(c);const prev=i>0?cs[i-1]:null;const pst=prev?cycStats(prev):null;const closed=!inCyc(c,today());const hasPrev=closed&&!!(pst&&pst.exp.length);
  const own=st.exp.filter(e=>!e.payout);const ctNow={},ctPrev={};for(const e of own)ctNow[e.cat]=(ctNow[e.cat]||0)+e.amount;if(hasPrev)for(const e of pst.exp.filter(e=>!e.payout))ctPrev[e.cat]=(ctPrev[e.cat]||0)+e.amount;
  const flexDay={};for(const e of own.filter(isFlex))flexDay[e.date]=1;const days=cycDays(c);const zero=days.filter(d=>!flexDay[d]).length;
  const good=[],bad=[];

  if(hasPrev&&pst.salary&&st.salary){const d=st.spent-pst.spent;if(d<=-1000)good.push(`Spending from salary fell by <b>${fmt(-d)}</b> against ${esc(prev.label)}.`);else if(d>=1000)bad.push(`Spending from salary rose by <b>${fmt(d)}</b> against ${esc(prev.label)}.`)}
  const moves=hasPrev?Object.keys({...ctNow,...ctPrev}).map(k=>({k,d:(ctNow[k]||0)-(ctPrev[k]||0),now:ctNow[k]||0,was:ctPrev[k]||0})).filter(x=>Math.abs(x.d)>=1000):[];
  moves.filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,2).forEach(x=>good.push(`<b>${esc(catName(x.k))}</b> came down by ${fmt(-x.d)}, to ${fmt(x.now)}.`));
  moves.filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,2).forEach(x=>bad.push(`<b>${esc(catName(x.k))}</b> went up by ${fmt(x.d)}, to ${fmt(x.now)}.`));

  const sm=own.filter(e=>e.amount>0&&e.amount<smallAt());const smT=sum(sm,e=>e.amount);if(st.spent&&smT/st.spent>=0.25)bad.push(`Small spends under ${fmt(smallAt())} added up to <b>${fmt(smT)}</b> across ${sm.length} entries.`);
  // the one change: the flexible category that grew most, else the largest one
  const flexCats=Object.entries(ctNow).filter(([k])=>!isFixed(cat(k))).map(([k,v])=>({k,v,d:v-(ctPrev[k]||0)}));let pick=null;
  if(hasPrev)pick=flexCats.filter(x=>x.d>=1000).sort((a,b)=>b.d-a.d)[0]||null;if(!pick)pick=flexCats.sort((a,b)=>b.v-a.v)[0]||null;

  return {c,st,good:good.slice(0,3),bad:bad.slice(0,3),change,hasPrev}}
function reviewHtml(cs,i){const r=review(cs,i);if(!r.st.es.length)return needMore('Nothing logged in '+esc(r.c.label)+'.');const done=!inCyc(r.c,today());

function spark(vals,col){const W=72,H=24;const hi=Math.max(...vals,1),lo=Math.min(...vals,0);const X=k=>2+k/(vals.length-1)*(W-4),Y=v=>H-3-(v-lo)/(hi-lo||1)*(H-6);

function wrapStats(es,label){

function rLong(){

  let h='';

  let bal=[],nw=[],run=open;for(let d=d0;d<=today();d=addDays(d,1)){run+=net[d]||0;bal.push({d,v:run});if(extra){const cy=cs.find(x=>inCyc(x,d));nw.push({d,v:run-cardOwedAt(d)+committeeAt(cy?cy.key:labelFor(d).key)})}}

  const cs=cycles();const nowC=cs.find(x=>inCyc(x,today()))||cs[cs.length-1];const nowKey=nowC.key;
  const monthly=sum(m.parts,p=>p.amt);const paid=Math.max(0,Math.min(m.months,keyDiff(nowKey,m.start)+1));const left=m.months-paid;const put=paid*monthly,all=m.months*monthly;const endKey=keyAdd(m.start,m.months-1);
  const got=sum(m.parts.filter(p=>p.payoutMonth&&p.payoutMonth<=nowKey),p=>cmPay(p,m));const due=sum(m.parts,p=>cmPay(p,m))-got;const net=got-put;

  <div class="lbl" style="margin-top:14px">Your shares and their payouts</div><table class="t"><tr><th>Share</th><th>Payout</th><th>When</th></tr>${m.parts.map(p=>{const rec=p.payoutMonth&&p.payoutMonth<=nowKey;return `<tr><td>${fnum(p.amt)} a month${m.unit>0?'<div class="delta">'+shareTxt(p.amt/m.unit)+'</div>':''}</td><td>${fnum(cmPay(p,m))}</td><td>${rec?'<span class="good">Received '+keyLabel(p.payoutMonth)+'</span>':p.payoutMonth?'Due '+keyLabel(p.payoutMonth):'Date not set'}</td></tr>`}).join('')}</table>

  <div class="note ${net>0?'p':''}" style="margin-top:8px">${net>0?`Right now you hold <b>${fmt(net)}</b> more than you have paid in. You pay that back through the remaining instalments.`:net<0?`Right now you have paid in <b>${fmt(-net)}</b> more than you have received. It comes back with the payout${due?' still to come':''}.`:'You have received exactly what you have paid in.'}</div>

function balanceCard(){const b=balances();const ck=S.checks||{};

const BR=()=>window.AndroidBridge||null;

const SNAP='paisa.snap.';
function snapKeys(){const ks=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(SNAP)===0)ks.push(k)}}catch(e){}return ks.sort()}
function snapPrune(){const ks=snapKeys();const keep=6;for(let i=0;i<ks.length-keep;i++)try{localStorage.removeItem(ks[i])}catch(e){}}
function snapStore(key){try{const cur=localStorage.getItem(LS);if(!cur)return;const d=JSON.parse(cur);if(!d.entries||!d.entries.length)return;localStorage.setItem(key,cur);snapPrune()}catch(e){try{const ks=snapKeys();if(ks.length){localStorage.removeItem(ks[0])}}catch(x){}}}
// The saved copy is still yesterday's when the first change of a day is about to be written.
function snapDaily(){const k=SNAP+today();try{if(localStorage.getItem(k)==null)snapStore(k)}catch(e){}}
function snapBefore(what){const n=new Date();snapStore(SNAP+today()+'T'+pad(n.getHours())+pad(n.getMinutes())+pad(n.getSeconds())+'-'+what)}
function snapLabel(k){const s=k.slice(SNAP.length);const d=s.slice(0,10);const m=s.match(/T(\d\d)(\d\d)\d\d-(.+)$/);return m?shortDate(d)+', '+m[1]+':'+m[2]+', before '+({import:'an import',restore:'a restore',wipe:'a wipe',rollback:'a roll back',split:'splitting Fuel and Maintenance'}[m[3]]||m[3]):'Start of '+shortDate(d)}

  openSheet(sheetHd('Restore points')+`<div class="sub">Paisa keeps a copy from the start of each day you change something, and one before every import, restore or wipe. The newest six are kept on this device.</div><div class="card list" style="margin-top:10px">${ks.map(k=>{let n=0;try{n=JSON.parse(localStorage.getItem(k)).entries.length}catch(e){}return `<button class="li" data-act="snapask" data-id="${esc(k)}"><span class="grow"><b>${esc(snapLabel(k))}</b><span>${n} entries</span></span><span class="chev">›</span></button>`}).join('')||'<div class="empty">No restore points yet. The first is made the next time you change something.</div>'}</div>`)}

function usualAmount(list){const cnt={};for(const e of list)cnt[e.amount]=(cnt[e.amount]||0)+1;const best=Math.max(...Object.values(cnt));const latest=sortE(list);return best>1?latest.find(e=>cnt[e.amount]===best).amount:latest[0].amount}

  SUG=Object.values(g).sort((a,b)=>b.length-a.length).slice(0,4).map(l=>{const last=sortE(l)[0];return {note:last.note.trim(),cat:last.cat,acc:last.acc,amount:usualAmount(l)}});
  el.innerHTML=SUG.map((s,i)=>`<button data-act="sugg" data-id="${i}">${esc(s.note)} <span class="sub">${fnum(s.amount)}</span></button>`).join('')}
function dueItems(){const {cs,i,c}=curCycles();if(!inCyc(c,today())||i<1)return [];const prev=cs[i-1];const idx=daysBetween(c.start,today());
  const mine=noteGroups(S.entries.filter(e=>e.type==='expense'&&inCyc(c,e.date)));const skips=S.skips||{};
  const seen={};for(const x of cs.slice(0,i)){const g=noteGroups(xp(S.entries).filter(e=>e.type==='expense'&&!e.payout&&!e.refund&&inCyc(x,e.date)));for(const k in g)seen[k]=(seen[k]||0)+1}
  const pg=noteGroups(xp(S.entries).filter(e=>e.type==='expense'&&!e.payout&&!e.refund&&inCyc(prev,e.date)));const out=[];
  for(const k in pg){if(mine[k]||skips[c.key+'|'+k])continue;const e=pg[k].last;const c0=cat(e.cat);if(!c0)continue;if(!(seen[k]>=2||/bill|utilit|subscription/i.test(c0.name)))continue;

/* ---------- credit card: an itemised list kept apart from the main entries ---------- */
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dayIn=(y,m,d)=>iso(new Date(y,m,Math.min(d,dim(y,m))));
function stmtClose(d){const D=+S.card.stmtDay;const x=pd(d);let y=x.getFullYear(),m=x.getMonth();let c=dayIn(y,m,D);if(c<d){m++;if(m>11){m=0;y++}c=dayIn(y,m,D)}return c} // first statement date on or after d
function stmtPrev(c){const x=pd(c);let y=x.getFullYear(),m=x.getMonth()-1;if(m<0){m=11;y--}return dayIn(y,m,+S.card.stmtDay)}
function stmtNext(c){return stmtClose(addDays(c,1))}
function stmtDue(c){const U=+S.card.dueDay;const x=pd(c);let y=x.getFullYear(),m=x.getMonth();let d=dayIn(y,m,U);if(d<=c){m++;if(m>11){m=0;y++}d=dayIn(y,m,U)}return d} // first due day after the statement date

const inDays=d=>{const n=daysBetween(today(),d);return n===0?'today':n===1?'tomorrow':n>0?'in '+n+' days':n===-1?'yesterday':(-n)+' days ago'};

  return ps.map((e,i)=>{const from=i?addDays(ps[i-1].date,1):null;const items=(S.cardTx||[]).filter(x=>x.date<=e.date&&(!from||x.date>=from));return {e,from,items,total:sum(items,x=>x.amount)}})}
function cardOpenBal(){const ps=cardPays();const last=ps.length?ps[ps.length-1].e.date:null;const items=(S.cardTx||[]).filter(x=>!last||x.date>last);return {last,items,total:sum(items,x=>x.amount)}}
function drawCard(){sameSheet=sameSheet&&!!$('#cdBank');const cur=stmtClose(today());const c=!V.cardC||V.cardC>cur?cur:V.cardC;V.cardC=c;const st=stmtInfo(c);const isCur=c===cur;const hasOlder=(S.cardTx||[]).some(e=>e.date<st.from)||S.entries.some(e=>isCardBill(e)&&e.date<=c);
  const ct={};for(const e of st.items)ct[e.cat]=(ct[e.cat]||0)+e.amount;const rows=Object.entries(ct).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const mx=rows.length?rows[0][1]:1;
  // the bank's statement against what was itemised inside the statement period

  // each payment against everything bought since the payment before it
  const pays=cardPays().filter(x=>x.e.date>c&&x.e.date<=stmtNext(c));const ob=cardOpenBal();
  let pay=pays.map(x=>{const d=x.e.amount-x.total;return `<div class="payblk"><div class="kv"><span>Paid on ${shortDate(x.e.date)}</span><b class="num">${fmt(x.e.amount)}</b></div><button class="kv tap" data-act="cardpaid" data-id="${x.e.id}"><span>Purchases it cleared${x.from?', '+shortDate(x.from)+' to '+shortDate(x.e.date):', up to '+shortDate(x.e.date)}</span><b class="num">${fmt(x.total)}</b></button>${x.items.length?`<div class="kv"><span>Payment minus those purchases</span><b class="num ${d>0?'bad':''}">${d>0?'+':d<0?'−':''}${fmt(Math.abs(d))}</b></div><div class="note ${d>0?'w':''}" style="margin-top:8px">${d===0?'The payment matches your entries exactly.':d>0?`You paid <b>${fmt(d)}</b> more than you itemised. That is fees, interest, or purchases you did not log.`:`You itemised <b>${fmt(-d)}</b> more than you paid. Either part of the balance is still unpaid, or a purchase was refunded.`}</div>`:'<div class="sub" style="padding-top:6px">No purchases are itemised before this payment, so there is nothing to compare it with.</div>'}</div>`}).join('');
  if(!pay)pay=`<div class="sub">${isCur?'No payment falls in this statement’s window yet.':'No CC Bill payment is logged between '+shortDate(addDays(c,1))+' and '+shortDate(stmtNext(c))+'.'}</div>`;
  if(isCur)pay+=`<div class="payblk"><button class="kv tap" data-act="cardpaid" data-id="open"><span>Bought since ${ob.last?'your payment on '+shortDate(ob.last):'you started'}</span><b class="num">${fmt(ob.total)}</b></button><div class="sub" style="padding-top:6px">${ob.items.length} purchase${ob.items.length===1?'':'s'}. This is what clearing the card today would cover, as far as you have logged.</div></div>`;
  openSheet(sheetHd(esc(S.card.name||'Credit card'))+`<div class="row" style="margin-bottom:8px"><div class="monthnav" style="flex:1;justify-content:space-between"><button data-act="cardnav" data-d="-1" ${hasOlder?'':'disabled'} aria-label="Earlier statement">‹</button><span>${shortDate(st.from)} to ${shortDate(c)}</span><button data-act="cardnav" data-d="1" ${isCur?'disabled':''} aria-label="Later statement">›</button></div></div>
  <div class="card" style="margin-top:0"><h2>${isCur?'This statement so far':'Statement of '+shortDate(c)}</h2><div class="kv"><span>Your itemised total, these dates</span><b class="num">${fmt(st.total)}</b></div><div class="kv" style="align-items:center"><span>Bank’s statement total</span><input class="inp" id="cdBank" inputmode="decimal" value="${st.bank||''}" placeholder="${isCur?'When it arrives':'Type it in'}" style="flex:0 0 130px;text-align:right;padding:7px 10px"></div>${cmp}</div>
  <div class="card"><h2>What you paid</h2>${pay}<div class="sub" style="padding-top:8px">A payment is compared with everything bought since the payment before it, because you clear the whole card when you pay.</div></div>
  <div class="card"><h2>Dates</h2><div class="kv"><span>Statement date</span><b class="num">${shortDate(c)} · ${inDays(c)}</b></div><div class="kv"><span>Payment due</span><b class="num ${!st.paid&&!isCur&&today()>st.due?'bad':''}">${shortDate(st.due)} · ${st.paid?'paid':inDays(st.due)}</b></div></div>
  ${rows.length?`<div class="card"><h2>Where it went</h2>${rows.map(([k,v])=>`<div class="catrow"><div class="row">${catDot(k,true)}<span class="grow" style="flex:1;min-width:0"><div class="row" style="gap:6px"><span class="grow" style="flex:1;font-weight:600">${esc(catName(k))}</span><b class="num">${fmt(v)}</b><span class="sub num" style="width:34px;text-align:right">${Math.round(v/Math.max(1,st.total)*100)}%</span></div><div class="bar" style="--c:var(--s${catLook(cat(k)).col})"><i style="width:${v/mx*100}%"></i></div></span></div></div>`).join('')}</div>`:''}
  <div class="card" style="padding-top:${st.items.length?2:14}px">${st.items.length?sortE(st.items).map(cardRow).join(''):'<div class="empty">No card purchases itemised for these dates.</div>'}</div>

function openCardPaid(id){let items,title;if(id==='open'){const ob=cardOpenBal();items=ob.items;title='Bought since '+(ob.last?shortDate(ob.last):'the start')}else{const x=cardPays().find(y=>y.e.id===id);if(!x)return;items=x.items;title='Cleared by the '+shortDate(x.e.date)+' payment'}

  S.cardTx=S.cardTx||[];const e={id:F.edit?F.cardId:uid(),amount:(F.refund?-1:1)*amt,date:F.date,note:(F.note||'').trim(),cat:F.cat,ts:F.edit?F.ts:Date.now()};

/* ---------- vehicles: odometer and litres ride along on fuel and maintenance entries ---------- */
const vehs=()=>S.vehicles||[];
const veh=id=>vehs().find(v=>v.id===id);
const vehKind=c=>!c?'':(c.veh!==undefined?c.veh:(/fuel|petrol/i.test(c.name)&&!/mainten/i.test(c.name))?'fuel':(/mainten|service|repair/i.test(c.name)&&!/fuel/i.test(c.name))?'service':'');
function vehLog(id){const a=[];for(const e of S.entries)if(e.type==='expense'&&e.veh===id)a.push({e,card:false,kind:vehKind(cat(e.cat))||'service'});for(const e of (S.cardTx||[]))if(e.veh===id)a.push({e,card:true,kind:vehKind(cat(e.cat))||'service'});
  return a.sort((x,y)=>x.e.date<y.e.date?-1:x.e.date>y.e.date?1:(x.e.odo||0)-(y.e.odo||0)||(x.e.ts||0)-(y.e.ts||0))}
// One-time: "Fuel & Maintenance" becomes "Fuel" plus a new "Maintenance".
function joinPayoutSplits(){let n=0;for(const r of S.entries.slice()){if(r.type!=='expense'||r.payout||!r.ts||r.ts%1!==0.5)continue;
    const a=S.entries.find(x=>x.type==='expense'&&x.payout&&x.ts===r.ts-0.5&&x.date===r.date&&x.cat===r.cat&&x.acc===r.acc&&(x.note||'')===(r.note||''));if(!a)continue;
    a.payAmt=a.amount;a.amount+=r.amount;S.entries.splice(S.entries.indexOf(r),1);n++}
  if(n)save();return n}
function splitFuel(){const c=S.categories.find(x=>x.type==='expense'&&/^fuel\s*(&|and)\s*maintenance$/i.test(x.name));if(!c||S.categories.some(x=>x.type==='expense'&&/^maintenance$/i.test(x.name)))return;
  snapBefore('split');c.name='Fuel';c.icon='fuel';c.veh='fuel';const m={id:uid(),name:'Maintenance',type:'expense',icon:'tool',col:6,veh:'service',fixed:false};S.categories.splice(S.categories.indexOf(c)+1,0,m);
  const kw=/oil|service|tun|tyre|tire|punct|wash|repair|mechanic|brake|chain|filter|batter|spark|clutch|bumper|dent|paint|align|workshop|parts?\b|bulb|wiper/i;let n=0;for(const e of S.entries.concat(S.cardTx||[]))if(e.cat===c.id&&kw.test(e.note||'')){e.cat=m.id;n++}
  S.splitDone={moved:n};save()}
function vehApply(e){const k=vehKind(cat(e.cat));if(!k||!F.veh||!veh(F.veh))return null;e.veh=F.veh;const odo=calc(F.odo);
  if(odo>0){const others=vehLog(F.veh).filter(x=>x.e.id!==e.id&&x.e.odo>0);const before=others.filter(x=>x.e.date<e.date).map(x=>x.e.odo),after=others.filter(x=>x.e.date>e.date).map(x=>x.e.odo);

function cleanCell(v){if(typeof v!=='string')return v;let s=v.replace(/\u0000/g,'');if(s.length>2){let sp=true;for(let i=1;i<s.length;i+=2)if(s[i]!==' '){sp=false;break}if(sp){let t='';for(let i=0;i<s.length;i+=2)t+=s[i];s=t}}return s.trim()}
function sheetRows(wb,name){const ws=wb.Sheets[name];if(!ws)return [];const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).map(r=>r.map(cleanCell));if(!a.length)return [];const hd=a[0].map(x=>String(x));return a.slice(1).filter(r=>r.some(x=>x!=='')).map(r=>{const o={};hd.forEach((k,i)=>o[k]=r[i]);return o})}
function parseHK(u8){
  const wb=XLSX.read(u8,{type:'array'});const act=sheetRows(wb,'ACTIVITIES');if(!act.length||!('Voucher Type' in act[0]))throw new Error('not hk');
  const accs=sheetRows(wb,'ACCOUNT');const out={accounts:[],entries:[],cats:[]};
  const toIso=s=>{const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);if(typeof s==='number'){const d=XLSX.SSF.parse_date_code(s);return d.y+'-'+pad(d.m)+'-'+pad(d.d)}return null};
  const tr=[];let n=0;
  for(const r of act){const type=String(r['Voucher Type']).toLowerCase(),date=toIso(r['Voucher Date']),amt=parseFloat(r['Voucher Amount']);if(!date||!isFinite(amt)||!amt)continue;
    const base={date,note:String(r['Description']||'').trim(),accName:String(r['Account Name']||'').trim(),ord:n++};
    if(type==='transfer')tr.push({...base,amt});
    else if(type==='income'||type==='expense')out.entries.push({...base,type,amount:Math.abs(amt),catName:String(r['Category Name']||'').trim()||(type==='income'?'Other Income':'Other Expenses')})}

  used.forEach(nm=>{if(nm&&!out.accounts.some(a=>a.name===nm))out.accounts.push({name:nm,opening:0})});
  return out}
function applyHK(p,replace){
  if(S.entries.length)snapBefore('import');
  if(replace){S.entries=[];S.accounts=[]}
  const aid={};for(const a of p.accounts){let x=S.accounts.find(y=>y.name.toLowerCase()===a.name.toLowerCase());if(!x){x={id:uid(),name:a.name,opening:a.opening||0};S.accounts.push(x)}else if(replace)x.opening=a.opening||0;aid[a.name]=x.id}
  const cid=(name,type)=>{if(type==='expense'&&/^fuel\s*(&|and)\s*maintenance$/i.test(name)&&S.categories.some(y=>y.type==='expense'&&/^fuel$/i.test(y.name)))name='Fuel';let c=S.categories.find(y=>y.type===type&&y.name.toLowerCase()===name.toLowerCase());if(!c){c={id:uid(),name,type};S.categories.push(c)}return c.id};
  const sig=e=>[e.date,e.type,e.amount,e.acc,e.toAcc||'',e.cat||'',(e.note||'').toLowerCase()].join('|');
  const have={};S.entries.forEach(e=>{const k=sig(e);have[k]=(have[k]||0)+1});
  let add=0,skip=0;const t0=Date.now();
  for(const r of p.entries.sort((a,b)=>a.ord-b.ord)){const e={id:uid(),type:r.type,amount:r.amount,date:r.date,note:r.note,acc:aid[r.accName],ts:t0+r.ord};
