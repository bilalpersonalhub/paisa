function doImport(){pickFile('.xls,.xlsx,application/vnd.ms-excel',u8=>{let p;try{p=parseHK(u8)}catch(e){return toast('That does not look like a Hysab Kytab export.')}
  const fin=rep=>{const r=applyHK(p,rep);V.key=null;closeSheet();render();toast(`Imported ${r.add} entries`+(r.skip?`, skipped ${r.skip} already here`:'')+'.')};
  if(!S.entries.length)return fin(true);
  pendA=()=>fin(false);pendB=()=>fin(true);
  openSheet(sheetHd('Import '+p.entries.length+' entries')+`<p style="margin:4px 2px 0">This device already has ${S.entries.length} entries.</p><button class="btn" data-act="pendA">Add new ones, skip duplicates</button><button class="btn danger" data-act="pendB">Replace everything</button><button class="btn ghost" data-act="close">Cancel</button>`)})}
let pendA=null,pendB=null;

/* ---------- PIN ---------- */
function h4(p){let h=5381;const s='paisa:'+p;for(let k=0;k<2000;k++)for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i)+k)|0;return String(h)}
function showLock(mode){ // mode: unlock | set
  let buf='',first=null;const el=document.createElement('div');el.id='lock';el.dataset.mode=mode;document.body.appendChild(el);const fp=mode==='unlock'&&S.settings.bio&&has('biometric');
  const draw=msg=>{el.innerHTML=`<b style="font-size:18px">${msg}</b><div class="pins">${[0,1,2,3].map(i=>`<i class="${i<buf.length?'f':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="x">${mode==='set'?'✕':''}</button><button data-n="0">0</button><button data-n="b">⌫</button></div>${fp?'<button data-n="f" class="fp">Use fingerprint</button>':''}`};
  const title=()=>mode==='unlock'?'Enter PIN':first==null?'Choose a 4-digit PIN':'Enter it again';
  draw(title());
  el.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const n=b.dataset.n;if(n==='f'){try{BR().biometric()}catch(e){}return}if(n==='b')buf=buf.slice(0,-1);else if(n==='x'){if(mode==='set')el.remove();return}else if(buf.length<4)buf+=n;
    if(buf.length===4){if(mode==='unlock'){if(h4(buf)===S.settings.pin){el.remove();unlocked();return}buf='';draw('Wrong PIN. Try again');return}
      if(first==null){first=buf;buf=''}else if(first===buf){S.settings.pin=h4(buf);save();el.remove();render();toast('PIN set.');return}else{first=null;buf='';draw('They did not match. Choose a PIN');return}}
    draw(title())};
  if(fp)try{BR().biometric()}catch(e){}}
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(S.settings.pin&&hiddenAt&&Date.now()-hiddenAt>120000&&!$('#lock'))showLock('unlock')});

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='bg'){if(ev.target===el)closeSheet();return}
  if(!a)return;
  switch(a){
    case 'tab':{const same=V.tab===id;V.tab=id;V.q='';window.scrollTo(0,0);render(same?'':'tab');break}
    case 'cyc':{const {cs,i}=curCycles();const n=cs[i+ +el.dataset.d];if(n){V.key=n.key;render(+el.dataset.d>0?'next':'prev')}break}
    case 'add':openEntry();break;
    case 'edit':openEntry(id);break;
    case 'close':closeSheet();break;
    case 'ftype':syncF();F.type=el.dataset.v;if(!F.edit)setDefaults();else{F.cat=null;if(F.type==='transfer'&&F.toAcc===F.acc)F.toAcc=null}drawEntry();break;
    case 'f':syncF();if(el.dataset.k==='veh'&&F.veh===el.dataset.v){F.veh=null;drawEntry();break}F[el.dataset.k]=el.dataset.v;if(el.dataset.k==='cat'&&!F.edit&&vehKind(cat(F.cat))&&!F.veh&&veh(S.mem.veh))F.veh=S.mem.veh;if(el.dataset.k==='acc'&&F.toAcc===F.acc)F.toAcc=null;if(el.dataset.k==='cat'&&F.type==='income'&&!F.edit)F.startsMonth=/^salary$/i.test(catName(F.cat));drawEntry();break;
    case 'fsw':{syncF();const k=el.dataset.k;F[k]=!F[k];drawEntry();break}
    case 'ops':{syncF();F.ops=!F.ops;drawEntry();const i=$('#amt');i&&i.focus();break}
    case 'morecat':syncF();F.more=!F.more;drawEntry();break;
    case 'vehset':openVeh(id);break;
    case 'vehsave':{const n=$('#vhName').value.trim();if(!n)return toast('Give the vehicle a name.');S.vehicles=S.vehicles||[];if(id){veh(id).name=n}else S.vehicles.push({id:uid(),name:n});save();closeSheet();render();break}
    case 'vehdel':S.vehicles=vehs().filter(v=>v.id!==id);save();closeSheet();render();break;
    case 'vehlist':openVehList(id,el.dataset.k);break;
    case 'op':{const i=$('#amt');i.value+=el.dataset.v;F.amount=i.value;i.focus();showCalc();break}
    case 'fsave':saveEntry();break;
    case 'fdel':{if(F.type==='card'){const g=(S.cardTx||[]).find(x=>x.id===F.cardId);S.cardTx=(S.cardTx||[]).filter(x=>x.id!==F.cardId);const back=F.back;save();render();if(back){F=null;drawCardFresh()}else closeSheet();toast('Deleted',g&&{label:'Undo',fn:()=>{S.cardTx.push(g);save();render();if($('#cdBank'))drawCardKeep()}});break}const gone=S.entries.find(e=>e.id===F.id);S.entries=S.entries.filter(e=>e.id!==F.id);save();closeSheet();render();toast('Deleted',gone&&{label:'Undo',fn:()=>{S.entries.push(gone);save();render()}});break}
    case 'acctview':openAcctView(id);break;
    case 'catview':openCatView(id);break;
    case 'acctedit':openAcct(id);break;
    case 'acctsave':{const n=$('#an').value.trim();if(!n)return toast('Give the account a name.');if(S.accounts.some(x=>x.id!==id&&x.name.toLowerCase()===n.toLowerCase()))return toast('That name is already used.');const o=calc($('#ao').value)||0;if(id){const x=acc(id);x.name=n;x.opening=o}else S.accounts.push({id:uid(),name:n,opening:o});S.settings.started=true;save();closeSheet();render();break}
    case 'acctclose':{const x=acc(id);x.closed=!x.closed;save();closeSheet();render();break}
    case 'acctdel':S.accounts=S.accounts.filter(x=>x.id!==id);save();closeSheet();render();break;
    case 'catedit':openCat(id,el.dataset.t);break;
    case 'catsave':{const n=$('#cn').value.trim();if(!n)return toast('Give the category a name.');const t=el.dataset.t;if(S.categories.some(x=>x.id!==id&&x.type===t&&x.name.toLowerCase()===n.toLowerCase()))return toast('That name is already used.');if(id){const x=cat(id);x.name=n;x.icon=CE.icon;x.col=+CE.col;if(t==='expense'){x.fixed=!!CE.fixed;x.veh=CE.veh||''}}else S.categories.push({id:uid(),name:n,type:t,icon:CE.icon,col:+CE.col,...(t==='expense'?{fixed:!!CE.fixed,veh:CE.veh||''}:{})});save();closeSheet();render();break}
    case 'ceveh':CE.name=$('#cn').value;CE.veh=id||'';drawCat();break;
    case 'cecol':CE.name=$('#cn').value;CE.col=+id;drawCat();break;
    case 'ceicon':CE.name=$('#cn').value;CE.icon=id;drawCat();break;
    case 'rlist':reportList(el.dataset.k,id);break;
    case 'rtab':V.rtab=id;window.scrollTo(0,0);render('tab');break;
    case 'wrap':V.wrap=id;render();break;
    case 'cut':V.cut=id;render();break;
    case 'cefix':CE.name=$('#cn').value;CE.fixed=!CE.fixed;el.classList.toggle('on',CE.fixed);break;
    case 'cmset':openCommittee(id);break;
    case 'cmadd':cmSync();CM.parts.push({amt:'',payout:'',payoutMonth:''});drawCommittee();break;
    case 'cmrm':cmSync();CM.parts.splice(+id,1);drawCommittee();break;
    case 'cmsave':{cmSync();const mo=Math.round(calc(CM.months));const parts=CM.parts.map(p=>({amt:calc(p.amt),payout:calc(p.payout)||0,payoutMonth:p.payoutMonth||''})).filter(p=>p.amt>0);if(!CM.start||!(mo>0)||!parts.length)return toast('Fill in the first month, number of months and at least one share.');const rec={name:(CM.name||'').trim(),unit:calc(CM.unit)||0,start:CM.start,months:mo,friend:calc(CM.friend)||0,parts};cmAll();if(CM.idx>=0)S.committees[CM.idx]=rec;else S.committees.push(rec);save();closeSheet();render();break}
    case 'cmdel':cmAll();if(CM&&CM.idx>=0)S.committees.splice(CM.idx,1);save();closeSheet();render();break;
    case 'bcfix':bcFix(id);break;
    case 'donut':donutTap(ev,el);break;
    case 'gocyc':V.key=id;V.rtab='month';window.scrollTo(0,0);render('tab');break;
    case 'cathide':{const x=cat(id);x.hidden=!x.hidden;save();closeSheet();render();break}
    case 'catdel':S.categories=S.categories.filter(x=>x.id!==id);save();closeSheet();render();break;
    case 'theme':S.settings.theme=id;save();applyTheme();render();break;
    case 'style':S.settings.style=id;save();applyTheme();render();break;
    case 'pin':if(S.settings.pin){S.settings.pin=null;S.settings.bio=false;save();render();toast('PIN removed.')}else showLock('set');break;
    case 'backup':doBackup();break;
    case 'restore':doRestore();break;
    case 'xlsx':openExport();break;
    case 'exgo':{const f=$('#exFrom').value,t=$('#exTo').value;closeSheet();doXlsx(f,t);break}
    case 'toastact':{const f=toastFn;toastFn=null;clearTimeout(toast.t);$('#toast').innerHTML='';if(f)f();break}
    case 'fav':quickLog(id);break;
    case 'sugg':{const x=SUG[+id];if(!x||!F)break;syncF();F.note=x.note;const c0=cat(x.cat);if(c0&&c0.type===(F.type==='card'?'expense':F.type))F.cat=x.cat;const a0=acc(x.acc);if(a0&&!a0.closed&&F.type!=='card')F.acc=x.acc;if(!(calc(F.amount)>0))F.amount=String(x.amount);drawEntry();break}
    case 'payday':openPayday();break;
    case 'cardopen':openCard();break;
    case 'review':openReview(id);break;
    case 'cardpaid':openCardPaid(id);break;
    case 'cardback':drawCardFresh();break;
    case 'cardnav':V.cardC=+el.dataset.d<0?stmtPrev(V.cardC):stmtNext(V.cardC);sameSheet=false;drawCardFresh();break;
    case 'cardadd':openCardItem(null,true);break;
    case 'cardedit':openCardItem(id,true);break;
    case 'cardset':openCardSetup();break;
    case 'cardsave':{const sd=Math.round(calc($('#ckStmt').value)),dd=Math.round(calc($('#ckDue').value));if(!(sd>=1&&sd<=31)||!(dd>=1&&dd<=31))return toast('Enter the statement day and the due day, each from 1 to 31.');S.card={name:$('#ckName').value.trim(),stmtDay:sd,dueDay:dd};save();render();if(F&&F.type==='card'){sameSheet=false;drawEntry()}else{V.cardC=null;sameSheet=false;openCard()}break}
    case 'cardoff':delete S.card;save();closeSheet();render();toast('Card tracking stopped. Your itemised purchases are kept.');break;
    case 'pradd':{prSync();const o=S.accounts.filter(a=>!a.closed&&a.id!==PR.acc);if(o.length)PR.transfers.push({to:(o.find(a=>!PR.transfers.some(t=>t.to===a.id))||o[0]).id,amount:''});drawPayday();break}
    case 'prrm':prSync();PR.transfers.splice(+id,1);drawPayday();break;
    case 'prsave':savePayday();break;
    case 'spadd':{syncF();const o=S.categories.filter(c=>c.type==='expense'&&!c.hidden&&c.id!==F.cat);if(!F.cat)return toast('Pick the main category first.');if(o.length)F.splits.push({cat:o[0].id,amount:''});drawEntry();break}
    case 'sprm':syncF();F.splits.splice(+id,1);drawEntry();break;
    case 'dueadd':dueAdd(id);break;
    case 'dueskip':{const d=DUE[+id];if(d){S.skips=S.skips||{};S.skips[curCycles().c.key+'|'+d.k]=1;save();render()}break}
    case 'rngclr':V.from='';V.to='';render();break;
    case 'snaps':openSnaps();break;
    case 'snapask':pending=()=>snapRestore(id);confirmSheet('Roll back?','This replaces what is on this device now with the copy from “'+esc(snapLabel(id))+'”. A restore point of the current state is made first.','pend','Roll back');break;
    case 'bkfolder':try{BR().pickBackupFolder()}catch(e){}break;
    case 'bkoff':try{BR().clearBackupFolder();localStorage.removeItem('paisa.autoAt');localStorage.removeItem('paisa.autoOk')}catch(e){}render();break;
    case 'bio':S.settings.bio=!S.settings.bio;save();el.classList.toggle('on',S.settings.bio);break;
    case 'nudge':S.settings.nudge=!S.settings.nudge;save();try{BR().setNudge(!!S.settings.nudge,+S.settings.nudgeHour||21)}catch(e){}render();break;
    case 'import':doImport();break;
    case 'startempty':S.settings.started=true;save();render();break;
    case 'wipe':confirmSheet('Wipe all data?','This deletes every entry, account and setting on this device. A restore point is kept in case it was a mistake; you can delete it under Restore points.','wipego','Wipe everything');break;
    case 'wipego':snapBefore('wipe');S=fresh();save();V.key=null;closeSheet();applyTheme();render();break;
    case 'pend':pending&&pending();pending=null;break;
    case 'pendA':pendA&&pendA();break;
    case 'pendB':pendB&&pendB();break;
  }
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='q'){V.q=t.value;render()}
  else if(t.id==='amt'){F.amount=t.value;showCalc();const pn=$('#payNote');if(pn&&F&&F.payout&&!F.refund)pn.innerHTML=payoutNoteText();const vh=$('#vehHint');if(vh)vh.textContent=vehHintText()}
  else if((t.id==='odo'||t.id==='lit')&&F){syncF();const vh=$('#vehHint');if(vh)vh.textContent=vehHintText()}
  else if(t.id==='note'&&F){F.note=t.value;noteSuggest(t.value)}
  else if(t.classList.contains('bc'))bcGap(t.dataset.id,t.value);
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='fAcc'){V.fAcc=t.value;render()}
  else if(t.id==='fCat'){V.fCat=t.value;render()}
  else if(t.id==='date'&&F){syncF();if(F.type==='income'||F.type==='card')drawEntry()}
  else if(t.id==='cdBank'){const v=calc(t.value);S.cardStm=S.cardStm||{};if(v>0)S.cardStm[V.cardC]={bank:v};else delete S.cardStm[V.cardC];save();drawCardKeep()}
  else if(t.id==='bigAt'){const v=calc(t.value);S.settings.bigAt=v>0?v:50000;save();render()}
  else if(t.id==='dFrom'){V.from=t.value;render()}
  else if(t.id==='dTo'){V.to=t.value;render()}
  else if(t.id==='prDate'||t.id==='prAcc'){prSync();PR.transfers=PR.transfers.filter(x=>x.to!==PR.acc);drawPayday()}
  else if(t.id==='nudgeHour'){S.settings.nudgeHour=+t.value;save();try{BR().setNudge(!!S.settings.nudge,+t.value)}catch(e){}}
  else if(t.id==='smallAt'){const v=calc(t.value);S.settings.smallAt=v>0?v:2000;save();render()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&V.sheet)closeSheet();if(ev.key==='Enter'&&F&&$('#amt')&&(ev.target.id==='amt'||ev.target.id==='note')){ev.preventDefault();saveEntry()}});

/* ---------- start ---------- */
splitFuel();joinPayoutSplits();
applyTheme();render('tab');
if(S.splitDone){const n=S.splitDone.moved;delete S.splitDone;save();setTimeout(()=>toast('Fuel & Maintenance is now two categories: Fuel and Maintenance.'+(n?' '+n+' entr'+(n===1?'y':'ies')+' moved to Maintenance.':'')),600)}
if(S.settings.pin)showLock('unlock');
if(has('takeAction'))try{const a=BR().takeAction();if(a)runAction(a)}catch(e){}
if(has('setLastLogged'))try{BR().setLastLogged(loggedToday()?today():'')}catch(e){}
autoBackupNow();
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoBackupNow()});
if(!window.AndroidBridge&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
